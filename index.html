(function(){
  var ua = navigator.userAgent || '';
  if (/KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(ua)) {
    document.documentElement.classList.add('inapp');
    var url = location.href;
    if (/Android/i.test(ua)) {
      var intent = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';

    }
  }
})();

function escHtml(s) {

}

} catch (e) {}
function storedTr(ko) {
  const row = i18nByKo[(ko || '').trim()];
  if (!row || !reportLang) return '';

}

}

const trWait = {};
async function translateKo(text, tl) {

    const my = (have && have.my) || await translateKo(ko, 'my');
    const row = { vi, my };
    i18nByKo[ko] = row;
    try { localStorage.setItem('cu-i18n', JSON.stringify(i18nByKo)); } catch (e) {}

      title: 'tr',
      description: JSON.stringify({ ko, vi, my }),

  })();

}

function koreaNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: parts.year + '-' + parts.month + '-' + parts.day, minutes: Number(parts.hour) * 60 + Number(parts.minute) };
}
function parseWorkRange(text) {
  const nums = String(text || '').match(/\d{1,2}(?::\d{2})?/g);
  if (!nums || nums.length < 2) return null;
  const toMin = s => {
    const bits = s.split(':');
    const hh = Number(bits[0]);
    const mm = bits[1] == null ? 0 : Number(bits[1]);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh > 24 || mm > 59) return null;
    if (hh === 24) return 24 * 60;
    return hh * 60 + mm;
  };
  const start = toMin(nums[0]);
  const end = toMin(nums[1]);
  if (start == null || end == null || start === end) return null;
  return { start, end };
}
function inShift(slotMin, range) {
  if (range.start < range.end) return slotMin >= range.start && slotMin <= range.end;
  return slotMin >= range.start || slotMin <= range.end;
}
function slotAlreadyDue(slotMin, range, nowMin) {
  if (!inShift(nowMin, range) || !inShift(slotMin, range)) return false;
  if (range.start < range.end) return nowMin >= slotMin;
  if (nowMin >= range.start) return slotMin >= range.start && slotMin <= nowMin;
  if (slotMin >= range.start) return true;
  return slotMin <= nowMin;
}
function shiftAnchorDate(now, range) {
  if (range.start > range.end && now.minutes < range.end) {
    const [y, m, d] = now.date.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() - 1);
    return dt.toISOString().slice(0, 10);
  }
  return now.date;
}

}

function personRecords() {
  const name = staffName.value.trim();
  const date = reportDate.value;
  if (!name || !date || !currentStore) return [];
  const encoded = encodeURIComponent(name);
  const prefix = `prog_${currentStore}_`;
  const mark = `_${date}`;
  const byShift = new Map();
  const keep = (shift, data) => {
    if (!shift || !data || (data.staff || '').trim() !== name) return;
    const id = shift + '\n' + (data.period || '').trim();
    const prev = byShift.get(id);
    if (!prev || (data.savedAt || 0) >= (prev.data.savedAt || 0)) byShift.set(id, { shift, data });
  };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k.startsWith(prefix)) {
      const rest = k.slice(prefix.length);
      const at = rest.lastIndexOf(mark);
      if (at <= 0) continue;
      const after = rest.slice(at + mark.length);
      const nameMark = '_' + encoded;
      if (after && after !== nameMark && !after.startsWith(nameMark + '_')) continue;
      keep(rest.slice(0, at), readStore(k));
      continue;
    }
    const sess = `sess_${currentStore}_${date}_${encoded}_`;
    if (k.startsWith(sess)) {
      const data = readStore(k);
      keep(data && data.shift, data);
    }
  }
  return [...byShift.values()];
}

function showcardKinds() {

function shiftMinutes(range) {

function isAmbientLogistics(title) {

function addItemOnce(items, it) {

function visibleItems(shift) {

  let removed = false;
  if (hideCigaretteCheck()) {
    const next = items.filter(it => !(it.title || '').replace(/\s/g, '').includes('담배재고체크'));
    if (next.length !== items.length) removed = true;

      collapsed.push(it);

async function stampCaption(file, text, index) {
  const img = await createImageBitmap(file);
  const lines = text.split('\n');
  const fontSize = Math.max(32, Math.round(img.width / 18));
  const bar = fontSize * lines.length + 36;
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height + bar;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, bar);
  ctx.drawImage(img, 0, bar);
  ctx.fillStyle = '#fff';
  ctx.font = fontSize + 'px sans-serif';
  lines.forEach((line, i) => ctx.fillText(line, 20, fontSize + 10 + i * (fontSize + 8)));
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  if (img.close) img.close();
  return new File([blob], 'photo-' + index + '.jpg', { type: 'image/jpeg' });
}

  }

}

function makeSummary() {
  const shiftKey = shiftSelect.value;
  const shift = allData[currentStore]?.shifts?.[shiftKey] || { items: [] };
  const when = new Date().toLocaleString('ko-KR');
  const names = { edu: '교육', prob: '수습', full: '정식' };
  const picked = (document.querySelector('input[name="workType"]:checked') || {}).value || '';
  const opt = shiftSelect.options[shiftSelect.selectedIndex];
  const shiftLabel = opt && opt.value ? opt.textContent.trim() : (shift.name || shiftKey || '');
  let sum = `전체 보고\n시간 : ${when}\n구분: ${names[picked] || ''}\n점포명: ${currentStore || ''}\n근무자이름: ${staffName.value.trim()}\n근무타입: ${shiftLabel}\n근무시간대: ${workPeriod.value.trim()}`;
  if (clockInRecord && clockInRecord.at) sum += `\n출근 점포: ${clockInRecord.store || currentStore || ''}`;
  visibleItems(shift).forEach(it => {
    const d = getItemData(it.id);
    const at = sessionReported[reportKey(it.id)] || '';
    sum += `\n\n업무: ${d?.title || it.title}\n상태: ${d && d.done ? '완료' : '미완료'}\n보고 완료 : ${at}`;
  });
  const memo = document.getElementById('dayMemo')?.value.trim() || '';
  const pay = readPay();
  const line = (label, yn, time) => label + ': ' + (yn === 'yes' ? '있음 ' + hourLabel(time) : '없음');
  sum += '\n\n' + line('지각 근무 차감 시간', pay.lateYn, pay.lateTime);
  sum += '\n' + line('단축 근무 차감 시간', pay.deductYn, pay.deductTime);
  sum += '\n' + line('추가 근무 추가 시간', pay.extraYn, pay.extraTime);
  sum += `\n\n퇴근 보고: ${memo}`;
  return sum;
}

function collectMissing() {

function saveWorkCalendar() {
  const parts = (reportDate.value || '').split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if (!y || !m || !d) return;
  const pay = readPay();
  const range = parseWorkRange(workPeriod.value);
  const hours = range ? shiftMinutes(range) / 60 : 0;
  const num = (yn, time) => yn === 'yes' ? Number(time) || 0 : 0;
  const late = num(pay.lateYn, pay.lateTime);
  const short = num(pay.deductYn, pay.deductTime);
  const extra = num(pay.extraYn, pay.extraTime);
  const rest = 0;
  const total = Math.round((hours + extra - rest - late - short) * 10) / 10;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('work-log-v1') || '{}') || {}; } catch (e) { saved = {}; }
  const mk = y + '-' + m;
  const day = String(d);
  if (!saved[mk] || typeof saved[mk] !== 'object') saved[mk] = {};
  const prev = saved[mk][day] && typeof saved[mk][day] === 'object' ? saved[mk][day] : {};
  saved[mk][day] = Object.assign({}, prev, {
    hours,
    extra: extra || null,
    short: short || null,
    late: late > 0,
    lateHours: late || null,
    rest,
    total,
    period: workPeriod.value.trim(),
    worker: staffName.value.trim(),
    type: (document.querySelector('input[name="workType"]:checked') || {}).value || null
  });
  localStorage.setItem('work-log-v1', JSON.stringify(saved));
}

// ===== 출근 QR =====
let clockInRecord = null;
let qrStream = null;
let qrRunning = false;
function clockDetailHtml() {
  if (!clockInRecord || !clockInRecord.at) return '';
  const store = escHtml(clockInRecord.store || currentStore || '');
  return `<div class="clock-detail" style="font-size:14px; line-height:1.5; margin:0 0 8px;">
    <div><strong>점포명:</strong> ${store}</div>
  </div>`;
}
function showClockIn() {}
function stopQr() {
  qrRunning = false;
  if (qrStream) qrStream.getTracks().forEach(t => t.stop());
  qrStream = null;
  const video = document.getElementById('qrVideo');
  if (video) video.srcObject = null;
}
function parseCuQr(text) {
  const raw = String(text || '').trim().replace(/[\s-]/g, '');
  if (!/^bgf/i.test(raw)) return null;
  const body = raw.slice(3);
  const take = (n) => {
    if (body.length <= n) return null;
    const ymd = body.slice(-n);
    const storeCode = body.slice(0, -n);
    if (!/^\d+$/.test(ymd) || !storeCode) return null;
    return { storeCode, ymd };
  };
  return take(8) || take(6);
}
function myStoreCode() {
  const fromStore = currentStore && allData[currentStore] ? String(allData[currentStore].code || '').trim() : '';
  return fromStore || String(localStorage.getItem('cu-access-code') || '').trim();
}
function sameStoreCode(a, b) {
  const x = String(a || '').replace(/\s/g, '').toLowerCase();
  const y = String(b || '').replace(/\s/g, '').toLowerCase();
  return !!x && x === y;
}
function qrDateOk(ymd) {
  const today = koreaNow().date.replace(/-/g, '');
  if (ymd.length === 8) return ymd === today;
  if (ymd.length === 6) return ymd === today.slice(2);
  return false;
}
function cameraDeniedMessage() {
  return '카메라를 켤 수 없습니다.\n카메라 권한 설정이 필요합니다.\n\n카카오톡 안에서 열었다면 크롬 또는 사파리로 여세요.\n아이폰: 설정 > Safari > 카메라 > 허용\n갤럭시: 크롬 주소창 자물쇠 > 권한 > 카메라 > 허용';
}
function finishClockIn(code) {
  stopQr();
  document.getElementById('barcodeModal').classList.add('hidden');
  const parsed = parseCuQr(code);
  if (!parsed) { alert('QR코드 인식 오류\nCU 출근 QR이 아닙니다.'); return; }
  const mine = myStoreCode();
  if (!mine) { alert('먼저 점포 코드로 들어가세요.'); return; }
  if (!sameStoreCode(parsed.storeCode, mine)) { alert('QR코드 인식 오류\n이 점포 QR이 아닙니다.'); return; }
  if (!qrDateOk(parsed.ymd)) { alert('QR코드 인식 오류\n오늘 출근 QR이 아닙니다.'); return; }
  clockInRecord = { at: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }), qr: String(code || ''), store: currentStore || '', date: (reportDate && reportDate.value) || koreaNow().date };
  showClockIn();
  document.querySelectorAll('.item').forEach(el => {
    if (!isClockItem(el.dataset.title)) return;
    const id = el.dataset.id;
    el.dataset.reported = '1';
    el.dataset.reportedAt = clockInRecord.at;
    sessionReported[reportKey(id)] = clockInRecord.at;
    const cb = el.querySelector('.done-cb');
    if (cb) cb.checked = true;
    const timeEl = document.getElementById('done-time-' + id);
    if (timeEl) timeEl.textContent = clockInRecord.at;
    const old = el.querySelector('.clock-detail');
    if (old) old.remove();
    const done = el.querySelector('.done-check');
    if (done) done.insertAdjacentHTML('afterend', clockDetailHtml());
  });
  saveProgress();
  syncDoneBorders();
  checkAllDone();
  alert('출근 처리되었습니다.\n' + clockInRecord.at);
}
async function loadJsQR() {
  if (window.jsQR) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
document.getElementById('qrHelpBtn').onclick = (e) => {
  e.preventDefault();
  e.stopPropagation();
  const box = document.querySelector('.qr-help');
  const showing = box.classList.contains('open') || (box.matches(':hover') && !box.classList.contains('closed'));
  box.classList.toggle('open', !showing);

document.getElementById('clockInBtn').onclick = async () => {
  const modal = document.getElementById('barcodeModal');
  const msg = document.getElementById('qrMsg');
  modal.classList.remove('hidden');
  msg.textContent = '포스 근무자 인증 QR을 비추세요.';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    modal.classList.add('hidden');
    alert(cameraDeniedMessage());
    return;
  }
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    modal.classList.add('hidden');
    alert(cameraDeniedMessage());
    return;
  }
  const video = document.getElementById('qrVideo');
  video.srcObject = qrStream;
  await video.play().catch(() => {});
  let detector = null;
  if ('BarcodeDetector' in window) {
    try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
  }
  if (!detector) {
    try { await loadJsQR(); } catch (e) { msg.textContent = '이 휴대폰에서는 QR을 읽지 못합니다.'; }
  }
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  qrRunning = true;
  const loop = async () => {
    if (!qrRunning) return;
    if (video.readyState >= 2 && video.videoWidth) {
      let code = '';
      if (detector) {
        try {
          const found = await detector.detect(video);
          if (found && found[0]) code = found[0].rawValue || '';
        } catch (e) {}
      } else if (window.jsQR) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const found = window.jsQR(img.data, img.width, img.height);
        if (found) code = found.data || '';
      }
      if (code) { finishClockIn(code); return; }
    }
    setTimeout(loop, 300);
  };
  loop();
};

document.getElementById('addStoreBtn').onclick = async () => {
  const name = prompt('새 점포명을 입력하세요');
  if (!name || allData[name]) {
    if (allData[name]) alert('이미 있는 점포입니다.');
    return;
  }
  allData[name] = {
    code: '',
    manager: '',
    phone: '',
    hours: '19',
    shifts: {
      P1: { name: '오픈.오전', items: [] },
      P2: { name: '주간.오후', items: [] },
      P3: { name: '오후.저녁', items: [] },
      P4: { name: '마감.야간', items: [] }
    }
  };
  try {
    const { error } = await supabase.from('stores').insert({ name, manager: '', phone: '', hours: '19' });
    if (error) throw error;
    await saveAll();
    refreshAdminStoreSelect();
    document.getElementById('adminStoreSelect').value = name;

function renderEditShifts(shifts) {
  const container = document.getElementById('editShifts');
  container.innerHTML = '';
  Object.entries(shifts).forEach(([key, sh]) => {
    const block = document.createElement('div');
    block.className = 'card shift-block';
    block.innerHTML = `
      <label>근무타입 코드</label><input class="s-key" value="${key}">
      <label>근무타입 이름</label><input class="s-name" value="${sh.name||''}">
      <div class="items"></div>
      <button type="button" class="btn btn-secondary" style="margin-top:8px;" onclick="addItem(this.previousElementSibling)">+ 항목 추가</button>
      <button class="btn btn-danger" style="margin-top:8px; margin-left:8px;" onclick="this.parentElement.remove()">삭제</button>
    `;
    const itemsDiv = block.querySelector('.items');
    (sh.items||[]).forEach(it => addItem(itemsDiv, it));
    container.appendChild(block);
  });
}
function escAttr(s) { return escHtml(s).replace(/"/g, '"'); }
function matchingCommonTitles(q) {
  const query = String(q || '').trim().toLowerCase();
  const titles = commonTitles.slice().sort((a, b) => a.localeCompare(b, 'ko'));
  if (!query) return titles;
  return titles.filter(title => title.toLowerCase().includes(query));
}
function commonOptions(selected, q) {
  const titles = matchingCommonTitles(q);
  return '<option value="">공통 항목에서 고르기</option>' + titles.map(t => `<option value="${escAttr(t)}"${t === selected ? ' selected' : ''}>${escHtml(t)}</option>`).join('');
}
function pickCommon(sel) {
  if (!sel.value) return;
  const item = sel.closest('.edit-item');
  const title = item.querySelector('.i-title');
  const desc = item.querySelector('.i-desc');
  if (title) title.value = sel.value;
  if (desc) {
    desc.value = commonDesc[sel.value] || '';
    desc.classList.remove('hidden');
  }
  const search = item.querySelector('.i-common-search');
  const box = item.querySelector('.i-common-list');
  if (search) search.value = '';
  if (box) { box.innerHTML = ''; box.classList.add('hidden'); }
  captureDraft();
}
async function saveCommonDesc(btn) {
  const item = btn.closest('.edit-item');
  const title = item.querySelector('.i-title').value.trim();
  const desc = item.querySelector('.i-desc').value.trim();
  if (!title) { alert('항목 이름을 먼저 적으세요.'); return; }
  await addCommonTitles([{ title, desc }]);
  const { error } = await supabase.from('checklist_items').update({ description: desc }).eq('store_name', '__i18n__').eq('shift_key', 'common').eq('title', title);
  if (error) { alert('공통 상세순서를 저장하지 못했습니다.'); return; }
  commonDesc[title] = desc;
  alert('공통 상세순서를 저장했습니다. 다음에 이 항목을 고르면 이 내용이 나옵니다.');
}
async function addCommonTitles(titles) {
  const fresh = [];
  (titles || []).forEach(entry => {
    const title = String((entry && entry.title) || entry || '').trim();
    const desc = entry && entry.desc ? String(entry.desc).trim() : '';
    if (!title || commonTitles.includes(title) || fresh.some(row => row.title === title)) return;
    fresh.push({ title, desc });
  });
  if (!fresh.length) return;
  const rows = fresh.map((row, i) => ({
    store_name: '__i18n__',
    shift_key: 'common',
    shift_name: '공통',
    item_order: commonTitles.length + i + 1,
    title: row.title,
    description: row.desc || '',
    photo_required: false
  }));
  const { error } = await supabase.from('checklist_items').insert(rows);
  if (error) { console.error(error); return; }
  fresh.forEach(row => { commonTitles.push(row.title); if (row.desc) commonDesc[row.title] = row.desc; });
  refreshCommonSelects();
}
function ensureCommonSeed() {
  return addCommonTitles(COMMON_SEED.filter(title => !commonHidden[title]).map(title => ({ title: title, desc: COMMON_DESC[title] || '' })));
}
function renderPickList(input) {
  const body = input.closest('.edit-body');
  const box = body.querySelector('.i-common-list');
  const sel = body.querySelector('.i-common');
  const current = input.closest('.edit-item').querySelector('.i-title')?.value.trim() || '';
  const q = input.value.trim();
  if (sel) sel.innerHTML = commonOptions(current, q);
  box.innerHTML = '';
  if (!q) { box.classList.add('hidden'); return; }
  const titles = matchingCommonTitles(q);
  box.classList.remove('hidden');
  if (!titles.length) {
    box.innerHTML = '<div style="color:#888; font-size:13px; padding:8px 2px;">찾는 항목이 없습니다.</div>';
    return;
  }
  titles.forEach(title => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'common-line';
    btn.textContent = title;
    btn.onclick = () => pickCommonTitle(input, title);
    box.appendChild(btn);
  });
}
function pickCommonTitle(input, title) {
  const item = input.closest('.edit-item');
  const name = item.querySelector('.i-title');
  const desc = item.querySelector('.i-desc');
  if (name) name.value = title;
  if (desc) {
    desc.value = commonDesc[title] || '';
    desc.classList.remove('hidden');
  }
  const sel = item.querySelector('.i-common');
  if (sel) sel.innerHTML = commonOptions(title);
  input.value = '';
  const box = item.querySelector('.i-common-list');
  box.innerHTML = '';
  box.classList.add('hidden');
  captureDraft();
}
function refreshCommonSelects() {
  document.querySelectorAll('.i-common').forEach(sel => {
    const item = sel.closest('.edit-item');
    const current = item && item.querySelector('.i-title') ? item.querySelector('.i-title').value.trim() : sel.value;
    sel.innerHTML = commonOptions(current);
  });
  document.querySelectorAll('.i-common-search').forEach(renderPickList);
}
function renderCommonList() {
  const panel = document.getElementById('commonList');
  if (!panel) return;
  const q = (document.getElementById('commonSearch')?.value || '').trim().toLowerCase();
  const titles = matchingCommonTitles(q);
  panel.innerHTML = titles.map(title => `
    <div class="common-row" data-title="${escAttr(title)}">
      <button type="button" class="common-line">${escHtml(title)}</button>
      <div class="common-edit hidden" style="padding:8px 0 12px;">
        <input class="common-title" value="${escAttr(title)}" style="margin-bottom:6px;">
        <textarea class="common-desc" style="min-height:64px;">${escHtml(commonDesc[title] || '')}</textarea>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button type="button" class="btn btn-primary common-save" style="flex:1;">저장</button>
          <button type="button" class="btn common-del">삭제</button>
        </div>
      </div>
    </div>
  `).join('') || '<div style="color:#888; font-size:13px; padding:10px 0;">찾는 공통 항목이 없습니다.</div>';
  panel.querySelectorAll('.common-row').forEach(row => {
    const oldTitle = row.dataset.title;
    row.querySelector('.common-line').onclick = () => {
      const edit = row.querySelector('.common-edit');
      const willOpen = edit.classList.contains('hidden');
      panel.querySelectorAll('.common-edit').forEach(el => el.classList.add('hidden'));
      if (willOpen) edit.classList.remove('hidden');
    };
    row.querySelector('.common-save').onclick = () => saveCommonRow(oldTitle, row.querySelector('.common-title').value, row.querySelector('.common-desc').value);
    row.querySelector('.common-del').onclick = () => deleteCommon(oldTitle);
  });
}
async function addNewCommon() {
  const titleEl = document.getElementById('newCommonTitle');
  const descEl = document.getElementById('newCommonDesc');
  const title = titleEl.value.trim();
  const desc = descEl.value.trim();
  if (!title) { alert('이름을 적으세요.'); return; }
  if (commonTitles.includes(title)) { alert('같은 이름의 공통 항목이 있습니다.'); return; }
  if (commonHidden[title]) {
    delete commonHidden[title];
    await supabase.from('checklist_items').delete().eq('store_name', '__i18n__').eq('shift_key', 'common-off').eq('title', title);
  }
  await addCommonTitles([{ title, desc }]);
  if (!commonTitles.includes(title)) { alert('추가하지 못했습니다.'); return; }
  commonDesc[title] = desc;
  titleEl.value = '';
  descEl.value = '';
  refreshCommonSelects();
  renderCommonList();
}
async function hideCommonTitle(title) {
  if (!title || commonHidden[title]) return;
  commonHidden[title] = true;
  const { error } = await supabase.from('checklist_items').insert({
    store_name: '__i18n__',
    shift_key: 'common-off',
    shift_name: '숨김',
    item_order: 0,
    title,
    description: '',
    photo_required: false
  });
  if (error) console.error(error);
}
async function saveCommonRow(oldTitle, title, desc) {
  title = String(title || '').trim();
  desc = String(desc || '').trim();
  if (!title) { alert('이름을 적으세요.'); return; }
  if (title !== oldTitle && commonTitles.includes(title)) { alert('같은 이름의 공통 항목이 있습니다.'); return; }
  const id = commonIds[oldTitle];
  let query = supabase.from('checklist_items').update({ title, description: desc });
  query = id ? query.eq('id', id) : query.eq('store_name', '__i18n__').eq('shift_key', 'common').eq('title', oldTitle);
  const { error } = await query;
  if (error) { alert('저장하지 못했습니다.'); return; }
  if (title !== oldTitle) {
    commonTitles = commonTitles.map(item => item === oldTitle ? title : item);
    delete commonDesc[oldTitle];
    if (commonIds[oldTitle]) {
      commonIds[title] = commonIds[oldTitle];
      delete commonIds[oldTitle];
    }
    await hideCommonTitle(oldTitle);
  }
  commonDesc[title] = desc;
  refreshCommonSelects();
  renderCommonList();
  alert('공통 항목을 저장했습니다.');
}
async function deleteCommon(title) {
  if (!confirm(title + '\n공통 항목을 지울까요?\n점포에 이미 넣은 항목은 그대로 둡니다.')) return;
  let query = supabase.from('checklist_items').delete().eq('store_name', '__i18n__').eq('shift_key', 'common').eq('title', title);
  const { error } = await query;
  if (error) { alert('지우지 못했습니다.'); return; }
  await hideCommonTitle(title);
  commonTitles = commonTitles.filter(item => item !== title);
  delete commonDesc[title];
  delete commonIds[title];
  refreshCommonSelects();
  renderCommonList();
}
document.getElementById('commonEditBtn').onclick = () => {
  const panel = document.getElementById('commonPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) renderCommonList();
};
document.getElementById('addCommonBtn').onclick = addNewCommon;
document.getElementById('commonSearch').oninput = renderCommonList;
window.pickCommon = pickCommon;
window.saveCommonDesc = saveCommonDesc;

function addItem(container, item = {title:'', desc:'', photo_required:false}) {
  const d = document.createElement('div');
  d.className = 'edit-item';
  const title = item.title || '';
  d.innerHTML = `
    <div class="edit-head">
      <span class="item-no-label">항목</span>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, -1)">▲</button>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, 1)">▼</button>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItemEdge(this, 'top')">맨위</button>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItemEdge(this, 'bottom')">맨아래</button>
      <button type="button" class="btn btn-danger" style="padding:4px 8px; margin-left:auto;" onclick="var box=this.closest('.items'); this.closest('.edit-item').remove(); renumberItems(box)">삭제</button>
    </div>
    <div class="edit-body">
      <input class="i-common-search" placeholder="공통 항목 검색" style="margin-bottom:4px;">
      <div class="i-common-list hidden"></div>
      <select class="i-common" onchange="pickCommon(this)">${commonOptions(title)}</select>
      <input class="i-title" value="${escAttr(title)}" placeholder="체크리스트 항목 이름" style="margin:4px 0;">
      <button type="button" class="btn btn-secondary" style="margin-top:6px; font-size:13px;" onclick="this.parentElement.querySelector('.i-desc').classList.toggle('hidden')">상세순서</button>
      <button type="button" class="btn btn-secondary" style="margin-top:6px; margin-left:6px; font-size:13px;" onclick="saveCommonDesc(this)">공통 상세순서 저장</button>
      <textarea class="i-desc ${item.desc ? '' : 'hidden'}" placeholder="상세 순서 설명">${escHtml(item.desc||'')}</textarea>
      <label style="margin-top:4px;"><input type="checkbox" class="i-photo" ${item.photo_required?'checked':''}> 사진 필수</label>
    </div>
  `;
  container.appendChild(d);
  const search = d.querySelector('.i-common-search');
  const refreshPick = () => renderPickList(search);
  search.addEventListener('input', refreshPick);
  search.addEventListener('compositionend', refreshPick);
  renumberItems(container);
}
function renumberItems(container) {
  if (!container) return;
  container.querySelectorAll('.edit-item').forEach((el, i) => {
    const n = el.querySelector('.item-no-label');
    if (n) n.textContent = (i + 1) + '번 항목';
  });
}
window.renumberItems = renumberItems;

function moveItem(btn, dir) {
  const item = btn.closest('.edit-item');
  const container = item.parentElement;
  const items = Array.from(container.querySelectorAll('.edit-item'));
  const idx = items.indexOf(item);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  if (dir < 0) {
    container.insertBefore(item, items[newIdx]);
  } else {
    container.insertBefore(item, items[newIdx].nextSibling);
  }
  captureDraft();
  renumberItems(container);
}
window.addItem = addItem;
window.moveItem = moveItem;
function moveItemEdge(btn, where) {
  const item = btn.closest('.edit-item');
  const container = item.parentElement;
  const items = Array.from(container.querySelectorAll('.edit-item'));
  if (items.length < 2) return;
  if (where === 'top') container.insertBefore(item, items[0]);
  else container.appendChild(item);
  captureDraft();
  renumberItems(container);
}
window.moveItemEdge = moveItemEdge;

document.getElementById('saveStoreBtn').onclick = async () => {
  const name = document.getElementById('editStoreName').value.trim();
  if (!name) { alert('점포명을 입력하세요.'); return; }
  const shifts = {};
  document.querySelectorAll('.shift-block').forEach(b => {
    const key = b.querySelector('.s-key').value.trim();
    if (!key) return;
    const items = [];
    b.querySelectorAll('.edit-item').forEach((el, i) => {
      const title = el.querySelector('.i-title').value.trim();
      if (!title) return;
      items.push({
        id: key.toLowerCase() + '-' + (i+1),
        title,
        desc: el.querySelector('.i-desc').value.trim(),
        photo_required: el.querySelector('.i-photo').checked
      });
    });
    shifts[key] = { name: b.querySelector('.s-name').value.trim(), items };
  });
  const prev = allData[name] || { hours: '19', shifts: {} };
  allData[name] = {
    code: prev.code || '',
    manager: document.getElementById('editManager').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    hours: prev.hours || '19',
    shifts: Object.assign({}, prev.shifts, shifts)
  };
  try {
    await saveStoreToDb(name);
    for (const [key, shift] of Object.entries(shifts)) {
      await saveShiftToDb(name, key, shift);
      for (const it of shift.items || []) {
        if ((it.desc || '').trim()) ensureTranslation(it.desc);
      }
    }
    await saveAll();
    const names = [];
    Object.values(shifts).forEach(shift => (shift.items || []).forEach(it => names.push({ title: it.title, desc: it.desc })));
    await addCommonTitles(names);
    alert('저장되었습니다.');
    saveAdminView({ on: true, screen: 'admin', store: name, shift: '', draft: null });
    editScreen.classList.add('hidden');
    adminScreen.classList.remove('hidden');
    refreshStoreSelect();
    refreshAdminStoreSelect();
    const sel = document.getElementById('adminStoreSelect');
    sel.value = name;
    sel.dispatchEvent(new Event('change'));
  } catch (e) {
    alert('저장 실패: ' + (e.message || e));
  }
};
document.getElementById('cancelEdit').onclick = () => {
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  saveAdminView({ on: true, screen: 'admin', store: editingStore || '', shift: '', draft: null });
};
