<script>
// 가장 먼저 실행되는 인앱 감지
(function(){
  var ua = navigator.userAgent || '';
  if (/KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(ua)) {
    document.documentElement.classList.add('inapp');
    var url = location.href;
    if (/Android/i.test(ua)) {
      var intent = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';
      setTimeout(function(){ location.href = intent; }, 300);
    }
  }
})();
</script>

async function loadData() {
  try {
    const { data: stores, error } = await supabase.from('stores').select('*');
    if (error) throw error;
    allData = {};
    for (const s of stores || []) {
      allData[s.name] = {
        manager: s.manager || '',
        phone: s.phone || '',
        hours: s.hours || '19',
        shifts: {}
      };
    }
    // 체크리스트 항목 불러오기
    const { data: items } = await supabase.from('checklist_items').select('*').order('item_order');
    (items || []).forEach(it => {
      if (!allData[it.store_name]) return;
      if (!allData[it.store_name].shifts[it.shift_key]) {
        allData[it.store_name].shifts[it.shift_key] = { name: it.shift_name || it.shift_key, items: [] };
      }
      allData[it.store_name].shifts[it.shift_key].items.push({
        id: it.id,
        title: it.title,
        desc: it.description || '',
        photo_required: it.photo_required
      });
    });
    refreshStoreSelect();
  } catch (e) {
    console.error(e);
    alert('데이터를 불러오지 못했습니다. Supabase 설정을 확인하세요.');
    // 실패 시 로컬 폴백
    const saved = localStorage.getItem('cu_stores');
    if (saved) try { allData = JSON.parse(saved); } catch(err){}
    refreshStoreSelect();
  }
}

async function saveAll() {
  // 관리자 저장 시 Supabase에 반영하는 로직은 나중에 추가
  localStorage.setItem('cu_stores', JSON.stringify(allData));
}
function refreshStoreSelect() {
  const stores = Object.keys(allData);
  storeSelect.innerHTML = '<option value="">-- 점포 선택 --</option>' + stores.map(s => `<option value="${s}">${s}</option>`).join('');
  shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>';
  checklistContainer.innerHTML = '';
  if (stores.length) {
    // 기본은 선택 안 된 상태
  }
}
loadData(); // Supabase에서 불러오기
reportDate.valueAsDate = new Date();

storeSelect.onchange = onStoreChange;
staffName.oninput = saveProgress;
workPeriod.oninput = saveProgress;
document.getElementById('dayMemo').oninput = saveProgress;
reportDate.onchange = () => { saveProgress(); renderChecklist(); };

function onStoreChange() {
  currentStore = storeSelect.value;
  const d = allData[currentStore];
  console.log('선택된 점포:', currentStore, d);
  if (!currentStore || !d) {
    shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>';
    storeInfo.innerHTML = '';
    checklistContainer.innerHTML = '';
    return;
  }
  updateManagerInfo(d);
  const defaultShifts = ['P1','P2','P3','P4'];
  shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>' + defaultShifts.map(k => {
    const name = (d.shifts && d.shifts[k] && d.shifts[k].name) ? d.shifts[k].name : k;
    return `<option value="${k}">${k} (${name})</option>`;
  }).join('');
  checklistContainer.innerHTML = '';
}

function updateManagerInfo(d) {
  if (!d) {
    storeInfo.innerHTML = '';
    return;
  }
  const manager = d.manager || '미등록';
  const phone = d.phone || '미등록';
  storeInfo.innerHTML = `
    <div style="margin-top:12px; padding:12px; background:#fff3f3; border:1px solid #e31837; border-radius:8px; font-size:15px;">
      <strong>관리자:</strong> ${manager}<br>
      <strong>전화번호:</strong> ${phone}
    </div>`;
}

shiftSelect.onchange = () => {
  if (!shiftSelect.value || !currentStore) {
    checklistContainer.innerHTML = '';
    return;
  }
  renderChecklist();
  checkAllDone();
};

function getKey() { return `prog_${currentStore}_${shiftSelect.value}_${reportDate.value}`; }
function saveProgress() {
  const data = {
    staff: staffName.value,
    period: workPeriod.value,
    dayMemo: document.getElementById('dayMemo')?.value || '',
    items: {}
  };
  document.querySelectorAll('.item').forEach(el => {
    const id = el.dataset.id;
    data.items[id] = { done: el.querySelector('.done-cb').checked, memo: el.querySelector('textarea')?.value || '' };
  });
  try { localStorage.setItem(getKey(), JSON.stringify(data)); } catch(e){}
  checkAllDone();
}
function loadProgress() {
  try {
    const s = localStorage.getItem(getKey());
    if (s) {
      const d = JSON.parse(s);
      if (d.staff) staffName.value = d.staff;
      if (d.period) workPeriod.value = d.period;
      if (d.dayMemo && document.getElementById('dayMemo')) document.getElementById('dayMemo').value = d.dayMemo;
      return d;
    }
  } catch(e){}
  return null;
}

function renderChecklist() {
  const d = allData[currentStore];
  if (!d) {
    checklistContainer.innerHTML = '<div class="card">점포를 먼저 선택하세요.</div>';
    return;
  }
  if (!d.shifts) d.shifts = {};
  const key = shiftSelect.value;
  if (!key) {
    checklistContainer.innerHTML = '';
    return;
  }
  if (!d.shifts[key]) d.shifts[key] = { name: key, items: [] };
  const shift = d.shifts[key];
  const items = shift.items || [];
  if (items.length === 0) {
    checklistContainer.innerHTML = '<div class="card" style="text-align:center; color:#888;">이 근무타입에 등록된 체크리스트가 없습니다.<br>관리자 모드에서 항목을 추가하세요.</div>';
    checkAllDone();
    return;
  }
  const saved = loadProgress();
  checklistContainer.innerHTML = items.map(item => {
    const sv = (saved && saved.items && saved.items[item.id]) || {};
    const hasDesc = item.desc && item.desc.trim();
    return `
      <div class="card item" data-id="${item.id}">
        <div class="item-title">${item.title} ${item.photo_required?'📷':''}
          ${hasDesc ? `<button class="btn btn-secondary" style="margin-left:8px; padding:4px 8px; font-size:12px;" data-action="toggle-desc">상세보기</button>` : ''}
        </div>
        <div class="item-desc hidden">${item.desc||''}</div>
        <div class="done-check"><input type="checkbox" class="done-cb" ${sv.done?'checked':''}><span>완료</span></div>
        <label>메모</label><textarea>${sv.memo||''}</textarea>
        <div class="btn-row">
          <button type="button" class="btn-photo">📷 사진찍기</button>
          <button type="button" class="btn-kakao">카톡</button>
          <button type="button" class="btn-sms">문자</button>
        </div>
        <div class="photo-preview" id="photos-${item.id}"></div>
      </div>`;
  }).join('');
  Object.keys(currentPhotos).forEach(id => renderPhotoPreview(id));
  checklistContainer.querySelectorAll('.done-cb, textarea').forEach(el => {
    el.addEventListener('change', saveProgress);
    el.addEventListener('input', saveProgress);
  });
  checklistContainer.querySelectorAll('.btn-photo').forEach(btn => {
    btn.addEventListener('click', () => takePhoto(btn.closest('.item').dataset.id));
  });
  checklistContainer.querySelectorAll('.btn-kakao').forEach(btn => {
    btn.addEventListener('click', () => shareItem(btn.closest('.item').dataset.id, false));
  });
  checklistContainer.querySelectorAll('.btn-sms').forEach(btn => {
    btn.addEventListener('click', () => shareItem(btn.closest('.item').dataset.id, true));
  });
  checklistContainer.querySelectorAll('[data-action="toggle-desc"]').forEach(btn => {
    btn.type = 'button';
    btn.addEventListener('click', () => {
      const desc = btn.parentElement.nextElementSibling;
      if (desc) desc.classList.toggle('hidden');
    });
  });
  saveProgress();
}

function checkAllDone() {
  const boxes = checklistContainer.querySelectorAll('.done-cb');
  if (boxes.length === 0) {
    bottomBar.classList.add('hidden');
    return;
  }
  const allDone = Array.from(boxes).every(cb => cb.checked);
  bottomBar.classList.toggle('hidden', !allDone);
}

function takePhoto(id) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = e => {
    const f = e.target.files[0];
    if (!f) { document.body.removeChild(inp); return; }
    if (!currentPhotos[id]) currentPhotos[id] = [];
    currentPhotos[id].push(f);
    renderPhotoPreview(id);
    document.body.removeChild(inp);
  };
  inp.click();
}
window.takePhoto = takePhoto;
function renderPhotoPreview(id) {
  const c = document.getElementById('photos-'+id);
  if (!c) return;
  const ps = currentPhotos[id] || [];
  c.innerHTML = ps.map((f,i) => `<img src="${URL.createObjectURL(f)}" onclick="removePhoto('${id}',${i})">`).join('');
}
function removePhoto(id, i) {
  if (currentPhotos[id]) { currentPhotos[id].splice(i,1); renderPhotoPreview(id); }
}
window.removePhoto = removePhoto;

function getItemData(id) {
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (!el) return null;
  return {
    title: el.querySelector('.item-title').textContent.replace('📷','').trim(),
    done: el.querySelector('.done-cb').checked,
    memo: el.querySelector('textarea').value.trim(),
    photos: currentPhotos[id] || []
  };
}

async function shareItem(id, isSms) {
  const d = getItemData(id); if (!d) return;
  const store = allData[currentStore] || {};
  const phone = (store.phone || '').replace(/-/g,'');
  const shiftTxt = shiftSelect.options[shiftSelect.selectedIndex]?.text || '';
  const itemEl = document.querySelector(`.item[data-id="${id}"]`);
  const desc = itemEl?.querySelector('.item-desc')?.textContent?.trim() || '';

  let text = `[${currentStore}] ${shiftTxt}\n`;
  text += `날짜: ${reportDate.value}\n`;
  text += `근무자: ${staffName.value || '미입력'}\n`;
  text += `출근: ${document.getElementById('clockTime').textContent || '-'}\n\n`;
  text += `▶ 업무: ${d.title}\n`;
  if (desc) text += `상세: ${desc}\n`;
  text += `상태: ${d.done ? '✅ 완료' : '❌ 미완료'}\n`;
  if (d.memo) text += `메모: ${d.memo}\n`;
  text += `사진: ${d.photos.length}장`;

  if (isSms) {
    location.href = phone ? `sms:${phone}?body=${encodeURIComponent(text)}` : `sms:?body=${encodeURIComponent(text)}`;
    return;
  }
  if (navigator.share) {
    const sd = { title: '체크리스트 업무보고', text };
    if (d.photos.length) sd.files = d.photos;
    try { await navigator.share(sd); return; } catch(e){}
  }
  navigator.clipboard.writeText(text).then(() => alert('업무 내용이 복사되었습니다.\n카카오톡이나 문자에 붙여넣기 하세요.'));
}
window.shareItem = shareItem;

async function makeSummary() {
  const store = allData[currentStore] || {};
  const shift = store.shifts?.[shiftSelect.value] || {name:'', items:[]};
  let sum = `📋 CU 체크리스트 보고서\n`;
  sum += `점포: ${currentStore}\n`;
  sum += `관리자: ${store.manager || ''}\n`;
  sum += `근무타입: ${shiftSelect.value} (${shift.name})\n`;
  sum += `날짜: ${reportDate.value}\n`;
  sum += `근무자: ${staffName.value || '미입력'}\n`;
  sum += `근무시간대: ${workPeriod.value || '-'}\n`;
  sum += `출근시간: ${document.getElementById('clockTime').textContent || '-'}\n`;
  sum += `보고시간: ${new Date().toLocaleString('ko-KR')}\n`;
  sum += `━━━━━━━━━━━━━━━━━━━━━━━━`;

  let photos = [], done = 0;
  (shift.items || []).forEach(it => {
    const d = getItemData(it.id); if (!d) return;
    if (d.done) done++;
    const itemEl = document.querySelector(`.item[data-id="${it.id}"]`);
    const desc = itemEl?.querySelector('.item-desc')?.textContent?.trim() || '';

    sum += `\n\n▶ ${it.title}\n`;
    if (desc) sum += `  상세: ${desc}\n`;
    sum += `  ${d.done ? '✅ 완료' : '❌ 미완료'}\n`;
    if (d.memo) sum += `  메모: ${d.memo}\n`;
    sum += `  사진: ${d.photos.length}장`;
    photos.push(...d.photos);
  });

  sum += `\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  sum += `완료: ${done}/${(shift.items || []).length}`;

  const dayMemo = document.getElementById('dayMemo')?.value.trim();
  if (dayMemo) {
    sum += `\n\n📝 오늘 메모\n${dayMemo}`;
  }
  return {sum, photos};
}

sendReportBtn.onclick = async () => {
  const {sum, photos} = await makeSummary();
  const store = allData[currentStore] || {};
  const phone = (store.phone || '').replace(/-/g,'');
  if (navigator.share) {
    const sd = { title: 'CU 보고서', text: sum };
    if (photos.length && photos.length <= 10) sd.files = photos;
    try { await navigator.share(sd); return; } catch(e){}
  }
  if (confirm('문자로 보낼까요?')) {
    location.href = phone ? `sms:${phone}?body=${encodeURIComponent(sum)}` : `sms:?body=${encodeURIComponent(sum)}`;
  } else {
    navigator.clipboard.writeText(sum).then(() => alert('복사되었습니다.'));
  }
};

// ===== 숨김 관리자 (10번) =====
document.getElementById('secretArea').addEventListener('click', function(e) {
  e.preventDefault();
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2500);
  if (clickCount >= 10) {
    clickCount = 0;
    document.getElementById('pwModal').classList.remove('hidden');
    document.getElementById('adminPw').value = '';
    document.getElementById('pwMsg').textContent = '';
    document.getElementById('adminPw').focus();
  }
});
document.getElementById('confirmPw').onclick = () => {
  if (document.getElementById('adminPw').value === ADMIN_PASSWORD) {
    document.getElementById('pwModal').classList.add('hidden');
    reportScreen.classList.add('hidden');
    adminScreen.classList.remove('hidden');
    refreshAdminStoreSelect();
  } else {
    document.getElementById('pwMsg').textContent = '비밀번호가 틀렸습니다.';
  }
};
document.getElementById('cancelPw').onclick = () => document.getElementById('pwModal').classList.add('hidden');
document.getElementById('backFromAdmin').onclick = () => {
  adminScreen.classList.add('hidden');
  reportScreen.classList.remove('hidden');
};

// ===== 관리자 점포 선택 =====
function refreshAdminStoreSelect() {
  const sel = document.getElementById('adminStoreSelect');
  const stores = Object.keys(allData);
  sel.innerHTML = '<option value="">-- 점포 선택 --</option>' + stores.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('storeDetail').classList.add('hidden');
}
document.getElementById('adminStoreSelect').onchange = function() {
  const name = this.value;
  const detail = document.getElementById('storeDetail');
  if (!name || !allData[name]) {
    detail.classList.add('hidden');
    return;
  }
  const d = allData[name];
  document.getElementById('detailTitle').textContent = name + ' 정보';
  document.getElementById('detailCode').value = d.code || '';
  document.getElementById('detailManager').value = d.manager || '';
  document.getElementById('detailPhone').value = d.phone || '';
  document.getElementById('detailHours').value = d.hours || '19';
  renderShiftButtons(name);
  detail.classList.remove('hidden');
};

document.getElementById('saveDetailBtn').onclick = () => {
  const name = document.getElementById('adminStoreSelect').value;
  if (!name || !allData[name]) return;
  allData[name].code = document.getElementById('detailCode').value.trim();
  allData[name].manager = document.getElementById('detailManager').value.trim();
  allData[name].phone = document.getElementById('detailPhone').value.trim();
  allData[name].hours = document.getElementById('detailHours').value;
  saveAll();
  alert('점포 정보가 저장되었습니다.');
};

function renderShiftButtons(storeName) {
  const container = document.getElementById('shiftButtons');
  container.innerHTML = '';
  ['P1','P2','P3','P4'].forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.style.cssText = 'width:100%; margin-bottom:8px;';
    btn.textContent = `점포체크리스트 ${p}`;
    btn.onclick = () => openShiftEdit(storeName, p);
    container.appendChild(btn);
  });
}

function openShiftEdit(storeName, shiftKey) {
  editingStore = storeName;
  const d = allData[storeName];
  if (!d.shifts) d.shifts = {};
  if (!d.shifts[shiftKey]) d.shifts[shiftKey] = { name: shiftKey, items: [] };
  document.getElementById('editTitle').textContent = `${storeName} - ${shiftKey} 체크리스트`;
  document.getElementById('editStoreName').value = storeName;
  document.getElementById('editStoreName').disabled = true;
  document.getElementById('editManager').value = d.manager || '';
  document.getElementById('editPhone').value = d.phone || '';
  renderEditShifts({ [shiftKey]: d.shifts[shiftKey] });
  adminScreen.classList.add('hidden');
  editScreen.classList.remove('hidden');
}

document.getElementById('addStoreBtn').onclick = () => {
  const name = prompt('새 점포명을 입력하세요');
  if (!name || allData[name]) {
    if (allData[name]) alert('이미 있는 점포입니다.');
    return;
  }
  allData[name] = {
    code: '',
    manager: '',
    phone: '',
    hours: '19',
    shifts: {
      P1: { name: '오픈.오전', items: [] },
      P2: { name: '주간.오후', items: [] },
      P3: { name: '오후.저녁', items: [] },
      P4: { name: '마감.야간', items: [] }
    }
  };
  saveAll();
  refreshAdminStoreSelect();
  document.getElementById('adminStoreSelect').value = name;
  document.getElementById('adminStoreSelect').dispatchEvent(new Event('change'));
  alert('점포가 추가되었습니다.');
};

function renderEditShifts(shifts) {
  const container = document.getElementById('editShifts');
  container.innerHTML = '';
  Object.entries(shifts).forEach(([key, sh]) => {
    const block = document.createElement('div');
    block.className = 'card shift-block';
    block.innerHTML = `
      <label>근무타입 코드</label><input class="s-key" value="${key}">
      <label>근무타입 이름</label><input class="s-name" value="${sh.name||''}">
      <div class="items"></div>
      <button class="btn btn-secondary" style="margin-top:8px;" onclick="addItem(this.previousElementSibling)">+ 항목 추가</button>
      <button class="btn btn-danger" style="margin-top:8px; margin-left:8px;" onclick="this.parentElement.remove()">삭제</button>
    `;
    const itemsDiv = block.querySelector('.items');
    (sh.items||[]).forEach(it => addItem(itemsDiv, it));
    container.appendChild(block);
  });
}
function addItem(container, item = {title:'', desc:'', photo_required:false}) {
  const d = document.createElement('div');
  d.className = 'edit-item';
  d.style.cssText = 'border:1px solid #eee; padding:10px; margin-bottom:8px; border-radius:6px; background:#fff;';
  d.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
      <span style="font-weight:700; color:#e31837;">순서</span>
      <button class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, -1)">▲</button>
      <button class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, 1)">▼</button>
      <button class="btn btn-danger" style="padding:4px 8px; margin-left:auto;" onclick="this.closest('.edit-item').remove()">삭제</button>
    </div>
    <input class="i-title" value="${item.title||''}" placeholder="체크리스트 항목 이름" style="margin-bottom:4px;">
    <button class="btn btn-secondary" style="margin-top:6px; font-size:13px;" onclick="this.nextElementSibling.classList.toggle('hidden')">상세순서</button>
    <textarea class="i-desc hidden" placeholder="상세 순서 설명">${item.desc||''}</textarea>
    <label style="margin-top:4px;"><input type="checkbox" class="i-photo" ${item.photo_required?'checked':''}> 사진 필수</label>
  `;
  container.appendChild(d);
}

function moveItem(btn, dir) {
  const item = btn.closest('.edit-item');
  const container = item.parentElement;
  const items = Array.from(container.querySelectorAll('.edit-item'));
  const idx = items.indexOf(item);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  if (dir < 0) {
    container.insertBefore(item, items[newIdx]);
  } else {
    container.insertBefore(item, items[newIdx].nextSibling);
  }
}
document.getElementById('addShiftBtn').onclick = () => {
  const container = document.getElementById('editShifts');
  const block = document.createElement('div');
  block.className = 'card shift-block';
  block.innerHTML = `
    <label>근무타입 코드</label><input class="s-key" value="P${container.children.length+1}">
    <label>근무타입 이름</label><input class="s-name" value="새 근무타입">
    <div class="items"></div>
    <button class="btn btn-secondary" style="margin-top:8px;" onclick="addItem(this.previousElementSibling)">항목 추가</button>
  `;
  container.appendChild(block);
};

document.getElementById('saveStoreBtn').onclick = () => {
  const name = document.getElementById('editStoreName').value.trim();
  if (!name) { alert('점포명을 입력하세요.'); return; }
  const shifts = {};
  document.querySelectorAll('.shift-block').forEach(b => {
    const key = b.querySelector('.s-key').value.trim();
    if (!key) return;
    const items = [];
    b.querySelectorAll('.edit-item').forEach((el, i) => {
      const title = el.querySelector('.i-title').value.trim();
      if (!title) return;
      items.push({
        id: key.toLowerCase() + '-' + (i+1),
        title,
        desc: el.querySelector('.i-desc').value.trim(),
        photo_required: el.querySelector('.i-photo').checked
      });
    });
    shifts[key] = { name: b.querySelector('.s-name').value.trim(), items };
  });
  if (editingStore && editingStore !== name) delete allData[editingStore];
  allData[name] = {
    manager: document.getElementById('editManager').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    shifts
  };
  saveAll();
  alert('저장되었습니다.');
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  refreshStoreSelect();
};
document.getElementById('cancelEdit').onclick = () => {
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
};
  } catch(err) {
    console.error('initApp error', err);
    alert('초기화 오류: ' + err.message);
  }
}
