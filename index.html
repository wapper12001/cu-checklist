<script>
// 가장 먼저 실행되는 인앱 감지
(function(){
  var ua = navigator.userAgent || '';
  if (/KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(ua)) {
    document.documentElement.classList.add('inapp');
    var url = location.href;
    if (/Android/i.test(ua)) {
      var intent = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';
      setTimeout(function(){ location.href = intent; }, 300);
    }
  }
})();
</script>

async function loadData() {
  try {
    const { data: stores, error } = await supabase.from('stores').select('*');

    allData = {};
    for (const s of stores || []) {

        phone: s.phone || '',
        hours: s.hours || '19',
        shifts: {}
      };

    const { data: items } = await supabase.from('checklist_items').select('*').order('item_order');
    (items || []).forEach(it => {
      if (!allData[it.store_name]) return;
      if (!allData[it.store_name].shifts[it.shift_key]) {
        allData[it.store_name].shifts[it.shift_key] = { name: it.shift_name || it.shift_key, items: [] };
      }
      allData[it.store_name].shifts[it.shift_key].items.push({
        id: it.id,
        title: it.title,
        desc: it.description || '',
        photo_required: it.photo_required
      });
    });

    restoreAdmin();

async function saveAll() {
  localStorage.setItem('cu_stores', JSON.stringify(allData));
}
async function saveStoreToDb(name) {
  const d = allData[name];
  if (!d) return;
  const { error } = await supabase.from('stores').update({
    manager: d.manager || '',
    phone: d.phone || '',
    hours: d.hours || '19'
  }).eq('name', name);
  if (error) throw error;
}
async function saveShiftToDb(storeName, shiftKey, shift) {
  const { error: delErr } = await supabase.from('checklist_items').delete().eq('store_name', storeName).eq('shift_key', shiftKey);
  if (delErr) throw delErr;
  const rows = (shift.items || []).filter(it => it.title).map((it, i) => ({
    store_name: storeName,
    shift_key: shiftKey,
    shift_name: shift.name || shiftKey,
    item_order: i + 1,
    title: it.title,
    description: it.desc || '',
    photo_required: !!it.photo_required
  }));
  if (!rows.length) return;
  const { error } = await supabase.from('checklist_items').insert(rows);
  if (error) throw error;
}
function refreshStoreSelect() {
  const stores = Object.keys(allData);
  storeSelect.innerHTML = '<option value="">-- 점포 선택 --</option>' + stores.map(s => `<option value="${s}">${s}</option>`).join('');
  shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>';
  checklistContainer.innerHTML = '';
  if (stores.length) {
    // 기본은 선택 안 된 상태
  }
}
loadData(); // Supabase에서 불러오기
reportDate.valueAsDate = new Date();

storeSelect.onchange = onStoreChange;
staffName.oninput = saveProgress;
workPeriod.oninput = saveProgress;
document.getElementById('dayMemo').oninput = saveProgress;
reportDate.onchange = () => { saveProgress(); renderChecklist(); };

function onStoreChange() {
  currentStore = storeSelect.value;
  const d = allData[currentStore];
  console.log('선택된 점포:', currentStore, d);
  if (!currentStore || !d) {
    shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>';
    storeInfo.innerHTML = '';
    checklistContainer.innerHTML = '';
    return;
  }
  updateManagerInfo(d);
  const defaultShifts = ['P1','P2','P3','P4'];
  shiftSelect.innerHTML = '<option value="">-- 근무타입 선택 --</option>' + defaultShifts.map(k => {
    const name = (d.shifts && d.shifts[k] && d.shifts[k].name) ? d.shifts[k].name : k;
    return `<option value="${k}">${k} (${name})</option>`;
  }).join('');
  checklistContainer.innerHTML = '';
}

function updateManagerInfo(d) {
  if (!d) {
    storeInfo.innerHTML = '';
    return;
  }
  const manager = d.manager || '미등록';
  const phone = d.phone || '미등록';
  storeInfo.innerHTML = `
    <div style="margin-top:12px; padding:12px; background:#f6f1fa; border:1px solid #6B2C91; border-radius:8px; font-size:15px;">
      <strong>관리자:</strong> ${manager}<br>
      <strong>전화번호:</strong> ${phone}
    </div>`;
}

shiftSelect.onchange = () => {
  if (!shiftSelect.value || !currentStore) {
    checklistContainer.innerHTML = '';
    return;
  }
  renderChecklist();
  checkAllDone();
};

function getKey() { return `prog_${currentStore}_${shiftSelect.value}_${reportDate.value}`; }
function saveProgress() {
  const data = {
    staff: staffName.value,
    period: workPeriod.value,
    dayMemo: document.getElementById('dayMemo')?.value || '',
    items: {}
  };
  document.querySelectorAll('.item').forEach(el => {
    const id = el.dataset.id;
    data.items[id] = {
      done: el.querySelector('.done-cb').checked,
      memo: el.querySelector('textarea')?.value || '',
      reported: el.dataset.reported === '1'
    };
  });
  try { localStorage.setItem(getKey(), JSON.stringify(data)); } catch(e){}
  checkAllDone();
}
function loadProgress() {
  try {
    const s = localStorage.getItem(getKey());
    if (s) {
      const d = JSON.parse(s);
      if (d.staff) staffName.value = d.staff;
      if (d.period) workPeriod.value = d.period;
      if (d.dayMemo && document.getElementById('dayMemo')) document.getElementById('dayMemo').value = d.dayMemo;
      return d;
    }
  } catch(e){}
  return null;
}

function renderChecklist() {
  const d = allData[currentStore];
  if (!d) {
    checklistContainer.innerHTML = '<div class="card">점포를 먼저 선택하세요.</div>';
    return;
  }
  if (!d.shifts) d.shifts = {};
  const key = shiftSelect.value;
  if (!key) {
    checklistContainer.innerHTML = '';
    return;
  }
  if (!d.shifts[key]) d.shifts[key] = { name: key, items: [] };
  const shift = d.shifts[key];
  const items = shift.items || [];
  if (items.length === 0) {
    checklistContainer.innerHTML = '<div class="card" style="text-align:center; color:#888;">이 근무타입에 등록된 체크리스트가 없습니다.<br>관리자 모드에서 항목을 추가하세요.</div>';
    checkAllDone();
    return;
  }
  const saved = loadProgress();
  checklistContainer.innerHTML = items.map(item => {
    const sv = (saved && saved.items && saved.items[item.id]) || {};
    const hasDesc = item.desc && item.desc.trim();
    return `
      <div class="card item" data-id="${item.id}" data-reported="${sv.reported ? '1' : '0'}">
        <div class="item-title">${item.title}
          ${hasDesc ? `<button class="btn btn-secondary" style="margin-left:8px; padding:4px 8px; font-size:12px;" data-action="toggle-desc">상세보기</button>` : ''}
        </div>
        <div class="item-desc hidden">${item.desc||''}</div>
        <div class="done-check"><input type="checkbox" class="done-cb" ${sv.done && requiredMissing(item.id, sv.reported).length === 0 ? 'checked' : ''}><span>완료</span></div>
        <label>메모</label><textarea>${sv.memo||''}</textarea>
        <div class="btn-row">
          <button type="button" class="btn-photo">📷 사진찍기</button>
          <button type="button" class="btn-kakao">카톡</button>
          <button type="button" class="btn-sms">문자</button>
        </div>
        <div class="photo-preview" id="photos-${item.id}"></div>
        <div class="miss-msg" id="miss-${item.id}"></div>
      </div>`;
  }).join('');
  Object.keys(currentPhotos).forEach(id => renderPhotoPreview(id));
  checklistContainer.querySelectorAll('.done-cb, textarea').forEach(el => {
    el.addEventListener('change', onItemEdited);
    el.addEventListener('input', () => { saveProgress(); refreshAllMiss(); });
  });
  checklistContainer.querySelectorAll('.btn-photo').forEach(btn => {
    btn.addEventListener('click', () => takePhoto(btn.closest('.item').dataset.id));
  });
  checklistContainer.querySelectorAll('.btn-kakao').forEach(btn => {
    btn.addEventListener('click', () => shareItem(btn.closest('.item').dataset.id, false));
  });
  checklistContainer.querySelectorAll('.btn-sms').forEach(btn => {
    btn.addEventListener('click', () => shareItem(btn.closest('.item').dataset.id, true));
  });
  checklistContainer.querySelectorAll('[data-action="toggle-desc"]').forEach(btn => {
    btn.type = 'button';
    btn.addEventListener('click', () => {
      const desc = btn.parentElement.nextElementSibling;
      if (desc) desc.classList.toggle('hidden');
    });
  });
  saveProgress();

}

function stopCam(stream) {
  if (stream) stream.getTracks().forEach(t => t.stop());
}
async function openRearStream() {
  const tries = [
    { video: { facingMode: { exact: 'environment' } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false }
  ];
  let lastErr;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { lastErr = e; }
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  const devices = await navigator.mediaDevices.enumerateDevices();
  const backs = devices.filter(d => d.kind === 'videoinput' && /back|rear|environment|후면|광각/i.test(d.label));
  const current = stream.getVideoTracks()[0];
  const facing = current.getSettings().facingMode;
  if (backs.length && (facing === 'user' || !/back|rear|environment|후면/i.test(current.label || ''))) {
    stopCam(stream);
    return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: backs[backs.length - 1].deviceId } }, audio: false });
  }
  if (facing === 'user') {
    stopCam(stream);
    throw lastErr || new Error('rear camera missing');
  }
  return stream;
}
function takePhoto(id) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    takePhotoByFile(id);
    return;
  }
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;';
  layer.innerHTML = '<video playsinline autoplay muted style="flex:1;width:100%;height:100%;object-fit:cover;background:#000;"></video><div style="display:flex;gap:10px;padding:14px 16px 22px;background:#111;"><button type="button" class="cam-shot" style="flex:1;background:#6B2C91;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;">촬영</button><button type="button" class="cam-close" style="background:#333;color:#fff;border:none;border-radius:10px;padding:14px 18px;font-size:16px;">닫기</button></div>';
  document.body.appendChild(layer);
  const video = layer.querySelector('video');
  let stream = null;
  const close = () => { stopCam(stream); if (layer.parentNode) layer.parentNode.removeChild(layer); };
  layer.querySelector('.cam-close').onclick = close;
  layer.querySelector('.cam-shot').onclick = () => {
    if (!video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      if (!blob) return;
      addPhotoFile(id, new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
      close();
    }, 'image/jpeg', 0.85);
  };
  openRearStream().then(s => {
    stream = s;
    video.srcObject = s;
    video.play().catch(() => {});
  }).catch(() => {
    close();
    takePhotoByFile(id);
  });
}
window.takePhoto = takePhoto;

async function stampCaption(file, text, index) {
  const img = await createImageBitmap(file);
  const lines = text.split('\n');
  const fontSize = Math.max(32, Math.round(img.width / 18));
  const bar = fontSize * lines.length + 36;
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, canvas.width, bar);
  ctx.fillStyle = '#fff';
  ctx.font = fontSize + 'px sans-serif';
  lines.forEach((line, i) => ctx.fillText(line, 20, fontSize + 10 + i * (fontSize + 8)));
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
  if (img.close) img.close();
  return new File([blob], 'photo-' + index + '.jpg', { type: 'image/jpeg' });
}
async function shareItem(id, isSms) {
  const d = getItemData(id); if (!d) return;
  const itemEl = document.querySelector(`.item[data-id="${id}"]`);
  const text = `업무: ${d.title}\n상태: ${d.done ? '완료' : '미완료'}`;
  const mark = () => {
    if (itemEl) itemEl.dataset.reported = '1';
    saveProgress();
    showMiss(id);
  };
  if (!d.photos.length || !navigator.share) {
    alert('사진이 없습니다.');
    return;
  }
  let files = d.photos;
  try {
    files = [];
    for (let i = 0; i < d.photos.length; i++) files.push(await stampCaption(d.photos[i], text, i + 1));
  } catch (e) {}
  try {
    await navigator.share({ files });
    mark();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    alert('사진을 보내지 못했습니다.');
  }
}

async function makeSummary() {
  const store = allData[currentStore] || {};
  const shift = store.shifts?.[shiftSelect.value] || {name:'', items:[]};
  let sum = `📋 CU 체크리스트 보고서\n`;
  sum += `점포: ${currentStore}\n`;
  sum += `관리자: ${store.manager || ''}\n`;
  sum += `근무타입: ${shiftSelect.value} (${shift.name})\n`;
  sum += `날짜: ${reportDate.value}\n`;
  sum += `근무자: ${staffName.value || '미입력'}\n`;
  sum += `근무시간대: ${workPeriod.value || '-'}\n`;
  sum += `출근시간: ${document.getElementById('clockTime').textContent || '-'}\n`;
  sum += `보고시간: ${new Date().toLocaleString('ko-KR')}\n`;
  sum += `━━━━━━━━━━━━━━━━━━━━━━━━`;

  let photos = [], done = 0;
  (shift.items || []).forEach(it => {
    const d = getItemData(it.id); if (!d) return;
    if (d.done) done++;
    const itemEl = document.querySelector(`.item[data-id="${it.id}"]`);
    const desc = itemEl?.querySelector('.item-desc')?.textContent?.trim() || '';

    sum += `\n\n▶ ${it.title}\n`;
    if (desc) sum += `  상세: ${desc}\n`;
    sum += `  ${d.done ? '✅ 완료' : '❌ 미완료'}\n`;
    if (d.memo) sum += `  메모: ${d.memo}\n`;
    sum += `  사진: ${d.photos.length}장`;
    photos.push(...d.photos);
  });

  sum += `\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  sum += `완료: ${done}/${(shift.items || []).length}`;

  const dayMemo = document.getElementById('dayMemo')?.value.trim();
  if (dayMemo) {
    sum += `\n\n📝 오늘 메모\n${dayMemo}`;
  }
  return {sum, photos};
}

function collectMissing() {
  const shift = allData[currentStore]?.shifts?.[shiftSelect.value];
  const lines = [];
  (shift?.items || []).forEach(it => {
    const msg = missMessage(requiredMissing(it.id));
    if (msg) lines.push(`${it.title}: ${msg}`);
  });
  return lines;
}

  const blocks = [];
  document.querySelectorAll('#editShifts .shift-block').forEach(b => {
    blocks.push({
      key: b.querySelector('.s-key').value,

    manager: document.getElementById('editManager').value,

function restoreAdmin() {
  const v = readAdminView();
  if (!v || !v.on) return;
  reportScreen.classList.add('hidden');
  if (v.screen === 'edit' && v.store && allData[v.store] && v.shift) {
    restoringAdmin = true;
    openShiftEdit(v.store, v.shift);
    if (v.manager != null) document.getElementById('editManager').value = v.manager;
    if (v.phone != null) document.getElementById('editPhone').value = v.phone;
    if (v.draft && v.draft.length) {
      const shifts = {};
      v.draft.forEach(sh => {
        shifts[sh.key] = {
          name: sh.name,
          items: (sh.items || []).map(it => ({ title: it.title, desc: it.desc, photo_required: !!it.photo }))
        };
      });
      renderEditShifts(shifts);
      const els = document.querySelectorAll('#editShifts .edit-item');
      let i = 0;
      v.draft.forEach(sh => (sh.items || []).forEach(it => {
        const el = els[i++];
        if (el && it.descOpen) el.querySelector('.i-desc').classList.remove('hidden');
      }));
    }
    restoringAdmin = false;
    return;
  }
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  refreshAdminStoreSelect();
  if (v.store && allData[v.store]) {
    const sel = document.getElementById('adminStoreSelect');
    sel.value = v.store;
    sel.dispatchEvent(new Event('change'));
  }
}

    </div>
    <input class="i-title" value="${item.title||''}" placeholder="체크리스트 항목 이름" style="margin-bottom:4px;">
    <button class="btn btn-secondary" style="margin-top:6px; font-size:13px;" onclick="this.nextElementSibling.classList.toggle('hidden')">상세순서</button>
    <textarea class="i-desc hidden" placeholder="상세 순서 설명">${item.desc||''}</textarea>
    <label style="margin-top:4px;"><input type="checkbox" class="i-photo" ${item.photo_required?'checked':''}> 사진 필수</label>
  `;
  container.appendChild(d);
}

function moveItem(btn, dir) {
  const item = btn.closest('.edit-item');
  const container = item.parentElement;
  const items = Array.from(container.querySelectorAll('.edit-item'));
  const idx = items.indexOf(item);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  if (dir < 0) {
    container.insertBefore(item, items[newIdx]);
  } else {
    container.insertBefore(item, items[newIdx].nextSibling);
  }
  captureDraft();
}
window.addItem = addItem;
window.moveItem = moveItem;

document.getElementById('saveStoreBtn').onclick = async () => {
  const name = document.getElementById('editStoreName').value.trim();
  if (!name) { alert('점포명을 입력하세요.'); return; }
  const shifts = {};
  document.querySelectorAll('.shift-block').forEach(b => {
    const key = b.querySelector('.s-key').value.trim();
    if (!key) return;
    const items = [];
    b.querySelectorAll('.edit-item').forEach((el, i) => {
      const title = el.querySelector('.i-title').value.trim();
      if (!title) return;
      items.push({
        id: key.toLowerCase() + '-' + (i+1),
        title,
        desc: el.querySelector('.i-desc').value.trim(),
        photo_required: el.querySelector('.i-photo').checked
      });
    });
    shifts[key] = { name: b.querySelector('.s-name').value.trim(), items };
  });
  const prev = allData[name] || { hours: '19', shifts: {} };
  allData[name] = {
    code: prev.code || '',
    manager: document.getElementById('editManager').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    hours: prev.hours || '19',
    shifts: Object.assign({}, prev.shifts, shifts)
  };
  try {
    await saveStoreToDb(name);
    for (const [key, shift] of Object.entries(shifts)) {
      await saveShiftToDb(name, key, shift);
    }
    await saveAll();
    alert('저장되었습니다.');
    saveAdminView({ on: true, screen: 'admin', store: name, shift: '', draft: null });
    editScreen.classList.add('hidden');
    adminScreen.classList.remove('hidden');
    refreshStoreSelect();
    refreshAdminStoreSelect();
    const sel = document.getElementById('adminStoreSelect');
    sel.value = name;
    sel.dispatchEvent(new Event('change'));
  } catch (e) {
    alert('저장 실패: ' + (e.message || e));
  }
};
document.getElementById('cancelEdit').onclick = () => {
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  saveAdminView({ on: true, screen: 'admin', store: editingStore || '', shift: '', draft: null });
};
  } catch(err) {
    console.error('initApp error', err);
    alert('초기화 오류: ' + err.message);
  }
}
</script>
