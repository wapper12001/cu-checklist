  if (/KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(ua)) {
    document.documentElement.classList.add('inapp');
    var url = location.href;
    if (/Android/i.test(ua)) {

    }
  }
})();

function koreaNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: parts.year + '-' + parts.month + '-' + parts.day, minutes: Number(parts.hour) * 60 + Number(parts.minute) };
}
function parseWorkRange(text) {
  const nums = String(text || '').match(/\d{1,2}(?::\d{2})?/g);
  if (!nums || nums.length < 2) return null;
  const toMin = s => {
    const bits = s.split(':');
    const hh = Number(bits[0]);
    const mm = bits[1] == null ? 0 : Number(bits[1]);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh > 24 || mm > 59) return null;
    if (hh === 24) return 24 * 60;
    return hh * 60 + mm;
  };
  const start = toMin(nums[0]);
  const end = toMin(nums[1]);
  if (start == null || end == null || start === end) return null;
  return { start, end };
}
function inShift(slotMin, range) {
  if (range.start < range.end) return slotMin >= range.start && slotMin <= range.end;
  return slotMin >= range.start || slotMin <= range.end;
}
function slotAlreadyDue(slotMin, range, nowMin) {
  if (!inShift(nowMin, range) || !inShift(slotMin, range)) return false;
  if (range.start < range.end) return nowMin >= slotMin;
  if (nowMin >= range.start) return slotMin >= range.start && slotMin <= nowMin;
  if (slotMin >= range.start) return true;
  return slotMin <= nowMin;
}
function shiftAnchorDate(now, range) {
  if (range.start > range.end && now.minutes < range.end) {
    const [y, m, d] = now.date.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() - 1);
    return dt.toISOString().slice(0, 10);
  }
  return now.date;
}
function dueDiscards() {
  if (!currentStore || !allData[currentStore]) return [];
  const range = parseWorkRange(workPeriod.value);
  if (!range) return [];
  const hours = String(allData[currentStore].hours || '19');
  const now = koreaNow();
  const anchor = shiftAnchorDate(now, range);
  return DISCARD_SLOTS.filter(s => {
    if (!slotAlreadyDue(s.min, range, now.minutes)) return false;
    if (s.who === '19' && hours !== '19') return false;
    if (s.who === '24' && hours !== '24') return false;
    return !localStorage.getItem('discard45_' + currentStore + '_' + anchor + '_' + s.id);
  });
}

function stopCam(stream) {

async function openRearStream() {
  const tries = [
    { video: camVideo({ facingMode: { exact: 'environment' } }), audio: false },
    { video: camVideo(), audio: false }
  ];
  let lastErr;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { lastErr = e; }
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  const devices = await navigator.mediaDevices.enumerateDevices();
  const backs = devices.filter(d => d.kind === 'videoinput' && /back|rear|environment|후면|광각/i.test(d.label));
  const current = stream.getVideoTracks()[0];
  const facing = current.getSettings().facingMode;
  if (backs.length && (facing === 'user' || !/back|rear|environment|후면/i.test(current.label || ''))) {
    stopCam(stream);
    return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: backs[backs.length - 1].deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  }
  if (facing === 'user') {
    stopCam(stream);
    throw lastErr || new Error('rear camera missing');
  }
  return stream;
}
function takePhoto(id) {

async function stampCaption(file, text, index) {
  const img = await createImageBitmap(file);
  const lines = text.split('\n');
  const fontSize = Math.max(32, Math.round(img.width / 18));
  const bar = fontSize * lines.length + 36;
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height + bar;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, bar);
  ctx.drawImage(img, 0, bar);
  ctx.fillStyle = '#fff';
  ctx.font = fontSize + 'px sans-serif';
  lines.forEach((line, i) => ctx.fillText(line, 20, fontSize + 10 + i * (fontSize + 8)));
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  if (img.close) img.close();
  return new File([blob], 'photo-' + index + '.jpg', { type: 'image/jpeg' });
}

  const line = (label, yn, time) => label + ': ' + (yn === 'yes' ? '있음 ' + hourLabel(time) : '없음');
  sum += '\n\n' + line('지각 근무 차감 시간', pay.lateYn, pay.lateTime);
  sum += '\n' + line('단축 근무 차감 시간', pay.deductYn, pay.deductTime);
  sum += '\n' + line('추가 근무 추가 시간', pay.extraYn, pay.extraTime);
  sum += `\n\n퇴근 보고: ${memo}`;
  return sum;
}

function collectMissing() {
  const lines = [];
  document.querySelectorAll('#checklistContainer .item').forEach(el => {
    const id = el.dataset.id;
    const title = itemById(id)?.title || '업무';
    const miss = requiredMissing(id);
    if (!el.querySelector('.done-cb').checked) lines.push(title + ': 완료가 안 됐습니다.');
    if (miss.includes('사진')) lines.push(title + ': 사진이 없습니다.');
    if (miss.includes('보고')) lines.push(title + ': 카톡 또는 문자 보고가 안 됐습니다.');
  });
  return lines;
}

function parseStamp(text) {
  if (!text) return null;
  if (/^\d{4}-\d{2}-\d{2}T/.test(text)) {
    const d = new Date(text);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  const m = String(text).match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.[^\d]*(오전|오후)?\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  let h = Number(m[5]);
  if (m[4] === '오후' && h < 12) h += 12;
  if (m[4] === '오전' && h === 12) h = 0;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), h, Number(m[6]), 0, 0);
}
function roundTenth(ms) {
  if (!ms || ms <= 60000) return 0;
  return Math.round((ms / 3600000) * 10) / 10;
}
function clockOn(dateStr, minutes) {
  const parts = dateStr.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
  d.setMinutes(minutes);
  return d;
}
async function saveWorkServer(record) {
  const shiftKey = encodeURIComponent(record.store) + '__' + encodeURIComponent(record.worker);
  const { data: found, error: findErr } = await supabase.from('checklist_items').select('id,description').eq('store_name', '__worklog__').eq('shift_key', shiftKey).eq('title', record.date);
  if (findErr) throw findErr;
  const prev = (found || [])[0];
  if (prev) {
    let old = {};
    try { old = JSON.parse(prev.description || '{}'); } catch (e) { old = {}; }
    if (old.edited) return;
    const { error } = await supabase.from('checklist_items').update({ description: JSON.stringify(record), shift_name: 'day' }).eq('id', prev.id);
    if (error) throw error;
    return;
  }
  const { error } = await supabase.from('checklist_items').insert({
    store_name: '__worklog__',
    shift_key: shiftKey,
    shift_name: 'day',
    item_order: 0,
    title: record.date,
    description: JSON.stringify(record),
    photo_required: false
  });
  if (error) throw error;
}
function saveWorkCalendar() {
  const parts = (reportDate.value || '').split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if (!y || !m || !d) return Promise.reject(new Error('날짜가 없습니다.'));
  const worker = staffName.value.trim();
  const store = currentStore;
  if (!store || !worker) return Promise.reject(new Error('점포와 이름을 입력하세요.'));
  const pay = readPay();
  const range = parseWorkRange(workPeriod.value);
  const hours = range ? Math.round((shiftMinutes(range) / 60) * 10) / 10 : 0;
  const num = (yn, time) => yn === 'yes' ? Number(time) || 0 : 0;
  const stamps = [];
  document.querySelectorAll('.item').forEach(el => {
    const at = el.dataset.reportedAt || sessionReported[reportKey(el.dataset.id)] || '';
    const when = parseStamp(at);
    if (when) stamps.push({ title: el.dataset.title || '', when });
  });
  const clockIn = stamps.find(s => String(s.title).includes('출근'));
  const inAt = clockIn ? clockIn.when : (stamps.slice().sort((a, b) => a.when - b.when)[0] || {}).when || null;
  const outAt = new Date();
  const dateStr = reportDate.value;
  let lateHours = num(pay.lateYn, pay.lateTime);
  let short = num(pay.deductYn, pay.deductTime);
  if (range && inAt) {
    lateHours = Math.max(lateHours, roundTenth(inAt - clockOn(dateStr, range.start)));
  }
  if (range) {
    const end = clockOn(dateStr, range.end);
    if (range.start > range.end) end.setDate(end.getDate() + 1);
    short = Math.max(short, roundTenth(end - outAt));
  }
  const type = (document.querySelector('input[name="workType"]:checked') || {}).value || null;
  const record = {
    store, worker, date: dateStr, type,
    start: workStart.value, end: document.getElementById('workEnd').value,
    hours, inAt: inAt ? inAt.toISOString() : '', outAt: outAt.toISOString(),
    late: lateHours > 0, lateHours: lateHours || null, short: short || null, extra: null,
    absent: false, off: false, edited: false, period: workPeriod.value.trim()
  };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('work-log-v1') || '{}') || {}; } catch (e) { saved = {}; }
  const mk = y + '-' + m;
  const day = String(d);
  if (!saved[mk] || typeof saved[mk] !== 'object') saved[mk] = {};
  saved[mk][day] = {
    type, hours, extra: null, short: short || null, late: lateHours > 0, lateHours: lateHours || null,
    rest: 0, total: hours, period: record.period, worker, store
  };
  localStorage.setItem('work-log-v1', JSON.stringify(saved));
  return saveWorkServer(record);
}

const ADMIN_VIEW_KEY = 'cu_admin_view';
let restoringAdmin = false;
function readAdminView() {
  try { return JSON.parse(sessionStorage.getItem(ADMIN_VIEW_KEY) || 'null'); } catch (e) { return null; }
}
function saveAdminView(patch) {
  const cur = readAdminView() || {};
  sessionStorage.setItem(ADMIN_VIEW_KEY, JSON.stringify(Object.assign({ on: true }, cur, patch)));
}
function clearAdminView() {
  sessionStorage.removeItem(ADMIN_VIEW_KEY);
}
function enterAdmin() {
  reportScreen.classList.add('hidden');
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  refreshAdminStoreSelect();
  saveAdminView({ on: true, screen: 'admin', store: '', shift: '', draft: null });
}
function captureDraft() {
  if (restoringAdmin || editScreen.classList.contains('hidden')) return;
  const blocks = [];
  document.querySelectorAll('#editShifts .shift-block').forEach(b => {
    blocks.push({
      key: b.querySelector('.s-key').value,
      name: b.querySelector('.s-name').value,
      items: Array.from(b.querySelectorAll('.edit-item')).map(el => ({
        title: el.querySelector('.i-title').value,
        desc: el.querySelector('.i-desc').value,
        photo: el.querySelector('.i-photo').checked,
        descOpen: !el.querySelector('.i-desc').classList.contains('hidden')
      }))
    });
  });
  saveAdminView({
    on: true,
    screen: 'edit',
    store: document.getElementById('editStoreName').value,
    shift: (blocks[0] && blocks[0].key) || '',
    manager: document.getElementById('editManager').value,
    phone: document.getElementById('editPhone').value,
    draft: blocks
  });
}
function restoreAdmin() {
  const v = readAdminView();
  if (!v || !v.on) return;
  reportScreen.classList.add('hidden');
  if (v.screen === 'edit' && v.store && allData[v.store] && v.shift) {
    restoringAdmin = true;
    openShiftEdit(v.store, v.shift);
    if (v.manager != null) document.getElementById('editManager').value = v.manager;
    if (v.phone != null) document.getElementById('editPhone').value = v.phone;
    if (v.draft && v.draft.length) {
      const shifts = {};
      v.draft.forEach(sh => {
        shifts[sh.key] = {
          name: sh.name,
          items: (sh.items || []).map(it => ({ title: it.title, desc: it.desc, photo_required: !!it.photo }))
        };
      });
      renderEditShifts(shifts);
      const els = document.querySelectorAll('#editShifts .edit-item');
      let i = 0;
      v.draft.forEach(sh => (sh.items || []).forEach(it => {
        const el = els[i++];
        if (el && it.descOpen) el.querySelector('.i-desc').classList.remove('hidden');
      }));
    }
    restoringAdmin = false;
    return;
  }
  editScreen.classList.add('hidden');
  adminScreen.classList.remove('hidden');
  refreshAdminStoreSelect();
  if (v.store && allData[v.store]) {
    const sel = document.getElementById('adminStoreSelect');
    sel.value = v.store;
    sel.dispatchEvent(new Event('change'));
  }
}

function openShiftEdit(storeName, shiftKey) {

function renderEditShifts(shifts) {
  const container = document.getElementById('editShifts');
  container.innerHTML = '';
  Object.entries(shifts).forEach(([key, sh]) => {
    const block = document.createElement('div');
    block.className = 'card shift-block';
    block.innerHTML = `
      <label>근무타입 코드</label><input class="s-key" value="${key}">
      <label>근무타입 이름</label><input class="s-name" value="${sh.name||''}">
      <div class="items"></div>
      <button type="button" class="btn btn-secondary" style="margin-top:8px;" onclick="addItem(this.previousElementSibling)">+ 항목 추가</button>
      <button class="btn btn-danger" style="margin-top:8px; margin-left:8px;" onclick="this.parentElement.remove()">삭제</button>
    `;
    const itemsDiv = block.querySelector('.items');
    (sh.items||[]).forEach(it => addItem(itemsDiv, it));
    container.appendChild(block);
  });
}
function addItem(container, item = {title:'', desc:'', photo_required:false}) {
  const d = document.createElement('div');
  d.className = 'edit-item';
  d.innerHTML = `
    <div class="edit-head">
      <span class="item-no-label">항목</span>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, -1)">▲</button>
      <button type="button" class="btn btn-secondary" style="padding:4px 8px;" onclick="moveItem(this, 1)">▼</button>
      <button type="button" class="btn btn-danger" style="padding:4px 8px; margin-left:auto;" onclick="var box=this.closest('.items'); this.closest('.edit-item').remove(); renumberItems(box)">삭제</button>
    </div>
    <div class="edit-body">
      <input class="i-title" value="${item.title||''}" placeholder="체크리스트 항목 이름" style="margin-bottom:4px;">
      <button class="btn btn-secondary" style="margin-top:6px; font-size:13px;" onclick="this.nextElementSibling.classList.toggle('hidden')">상세순서</button>
      <textarea class="i-desc hidden" placeholder="상세 순서 설명">${item.desc||''}</textarea>
      <label style="margin-top:4px;"><input type="checkbox" class="i-photo" ${item.photo_required?'checked':''}> 사진 필수</label>
    </div>
  `;
  container.appendChild(d);
  renumberItems(container);
}
function renumberItems(container) {
  if (!container) return;
  container.querySelectorAll('.edit-item').forEach((el, i) => {
    const n = el.querySelector('.item-no-label');
    if (n) n.textContent = (i + 1) + '번 항목';
  });
}
window.renumberItems = renumberItems;

function moveItem(btn, dir) {
  const item = btn.closest('.edit-item');
  const container = item.parentElement;
  const items = Array.from(container.querySelectorAll('.edit-item'));
  const idx = items.indexOf(item);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  if (dir < 0) {
    container.insertBefore(item, items[newIdx]);
  } else {
    container.insertBefore(item, items[newIdx].nextSibling);
  }
  captureDraft();
  renumberItems(container);
}
window.addItem = addItem;
window.moveItem = moveItem;
