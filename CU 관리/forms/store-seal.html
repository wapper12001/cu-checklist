<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직인 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #652f8d;
    --bg: #eee;
    --text: #111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 14px 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 4px;
    letter-spacing: 0.04em;
  }
  .note {
    font-size: 13px;
    color: #555;
    text-align: center;
    margin: 0 0 18px;
    line-height: 1.55;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(0,0,0,.12);
    padding: 16px 16px 18px;
  }
  .field { margin: 0 0 12px; }
  .field label, .legend {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #333;
  }
  input[type="text"], select {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(101,47,141,.15); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .choices label {
    font-weight: 400;
    font-size: 15px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  input[type="radio"], input[type="checkbox"] { accent-color: var(--purple); width: 16px; height: 16px; }
  input[type="range"] { width: 100%; accent-color: var(--purple); }
  .size-row { display: flex; align-items: center; gap: 10px; }
  .size-row input { flex: 1; }
  .size-val { font-size: 13px; color: #555; min-width: 3.5em; text-align: right; }
  .preview-card { text-align: center; }
  .preview-stage {
    margin: 8px auto 14px;
    width: min(100%, 360px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background:
      linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
      linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
      linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #f7f7f7;
  }
  .preview-stage.wide {
    width: 100%;
    aspect-ratio: 3.5 / 1;
  }
  #preview {
    display: block;
    max-width: 100%;
    height: auto;
  }
  .toolbar { text-align: center; }
  .toolbar button {
    font-family: inherit;
    font-size: 15px;
    padding: 8px 18px;
    margin: 0 4px 4px;
    cursor: pointer;
    border: 1px solid var(--purple);
    background: var(--purple);
    color: #fff;
    border-radius: 6px;
  }
  .toolbar button:disabled { opacity: .55; cursor: default; }
  .hint { font-size: 12px; color: #777; margin: 10px 0 0; }
  .msg { font-size: 13px; color: #555; margin: 8px 0 0; min-height: 1.3em; }
  .msg.error { color: #a33; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    h1 { font-size: 20px; }
    .preview-stage { width: min(100%, 320px); }
    .preview-stage.wide { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>직인 만들기</h1>
    <p class="note">이 직인은 내부 문서 확인용입니다. 관청에 등록된 인감이 아닙니다.</p>

    <div class="layout">
      <div class="card">
        <div class="field">
          <label for="storeName">점포(상호)명</label>
          <input type="text" id="storeName" autocomplete="organization">
        </div>
        <div class="field">
          <label for="bizNo">사업자등록번호</label>
          <input type="text" id="bizNo" inputmode="numeric" maxlength="12" autocomplete="off">
        </div>
        <div class="field">
          <label for="ownerName">대표자 성명</label>
          <input type="text" id="ownerName" autocomplete="name">
        </div>
        <div class="field">
          <span class="legend">모양</span>
          <div class="choices" role="radiogroup" aria-label="모양">
            <label><input type="radio" name="shape" value="round" checked> 동그란 직인</label>
            <label><input type="radio" name="shape" value="rect"> 직사각형 직인</label>
          </div>
        </div>
        <div class="field">
          <span class="legend">색</span>
          <div class="choices" role="radiogroup" aria-label="색">
            <label><input type="radio" name="color" value="red" checked> 빨간색</label>
            <label><input type="radio" name="color" value="blue"> 파란색</label>
          </div>
        </div>
        <div class="field">
          <label for="phrase">직인 문구</label>
          <select id="phrase">
            <option value="직인" selected>직인</option>
            <option value="인">인</option>
            <option value="대표이사지인">대표이사지인</option>
          </select>
        </div>
        <div class="field">
          <label for="sealSize">크기</label>
          <div class="size-row">
            <input type="range" id="sealSize" min="1200" max="2400" step="100" value="1800">
            <span class="size-val" id="sizeLabel">중간</span>
          </div>
        </div>
        <div class="field">
          <span class="legend">글꼴</span>
          <div class="choices" role="radiogroup" aria-label="글꼴">
            <label><input type="radio" name="font" value="myeongjo" checked> 명조</label>
            <label><input type="radio" name="font" value="gothic"> 고딕</label>
          </div>
        </div>
        <div class="field">
          <label><input type="checkbox" id="texture" checked> 잉크 질감</label>
        </div>
      </div>

      <div class="card preview-card">
        <div class="preview-stage" id="previewStage">
          <canvas id="preview" width="600" height="600" aria-label="직인 미리보기"></canvas>
        </div>
        <div class="toolbar">
          <button type="button" id="btnSave">이미지로 저장</button>
        </div>
        <p class="hint">투명 배경의 PNG로 저장됩니다.</p>
        <p class="msg" id="msg" aria-live="polite"></p>
      </div>
    </div>
  </div>

<script>
(function () {
  var INK_RED = "#c41a2b";
  var INK_BLUE = "#1a4a8c";
  var WIDE_RATIO = 3.5;
  var preview = document.getElementById("preview");
  var stage = document.getElementById("previewStage");
  var msgEl = document.getElementById("msg");
  var sizeInput = document.getElementById("sealSize");
  var bizInput = document.getElementById("bizNo");
  var drawTimer = null;

  function setMsg(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = "msg" + (isError ? " error" : "");
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || "").trim() : "";
  }

  function radio(name) {
    var el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : "";
  }

  function inkColor() {
    return radio("color") === "blue" ? INK_BLUE : INK_RED;
  }

  function fontStack() {
    if (radio("font") === "gothic") {
      return '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","NanumGothic",sans-serif';
    }
    return '"Nanum Myeongjo","Noto Serif KR","Batang","Apple Myungjo",serif';
  }

  function charsOf(s) {
    return Array.from(String(s || "").normalize("NFC"));
  }

  function compactName(s) {
    return String(s || "").replace(/\s+/g, "");
  }

  function tokensOf(s) {
    var t = compactName(s);
    var out = [], buf = "";
    var letters = charsOf(t);
    for (var i = 0; i < letters.length; i++) {
      var ch = letters[i];
      if (/^[A-Za-z0-9]$/.test(ch)) {
        buf += ch;
      } else {
        if (buf) { out.push(buf); buf = ""; }
        if (ch) out.push(ch);
      }
    }
    if (buf) out.push(buf);
    return out;
  }

  function digitsOnly(s) {
    return String(s || "").replace(/\D/g, "").slice(0, 10);
  }

  function formatBizNo(s) {
    var d = digitsOnly(s);
    if (d.length <= 3) return d;
    if (d.length <= 5) return d.slice(0, 3) + "-" + d.slice(3);
    return d.slice(0, 3) + "-" + d.slice(3, 5) + "-" + d.slice(5);
  }

  function sealName() {
    return val("storeName") || val("ownerName");
  }

  function hash(x, y) {
    var n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  function applyTexture(ctx, w, h) {
    var img = ctx.getImageData(0, 0, w, h);
    var d = img.data;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var i = (y * w + x) * 4;
        if (d[i + 3] < 10) continue;
        var n = hash(Math.floor(x / 2), Math.floor(y / 2));
        var fade = 0.86 + n * 0.16;
        d[i] = Math.min(255, Math.round(d[i] * fade));
        d[i + 1] = Math.min(255, Math.round(d[i + 1] * fade));
        d[i + 2] = Math.min(255, Math.round(d[i + 2] * fade));
        d[i + 3] = Math.round(d[i + 3] * (0.9 + n * 0.1));
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fitFont(ctx, text, fontFamily, weight, maxSize, minSize, maxWidth) {
    var size = maxSize;
    while (size > minSize) {
      ctx.font = weight + " " + size + "px " + fontFamily;
      if (ctx.measureText(text).width <= maxWidth) return size;
      size -= 1;
    }
    ctx.font = weight + " " + minSize + "px " + fontFamily;
    return minSize;
  }

  function phraseLines(phrase) {
    if (phrase === "대표이사지인") return ["대표이사", "지인"];
    return [phrase];
  }

  function drawRound(ctx, size, opts) {
    var ink = opts.color;
    var cx = size / 2, cy = size / 2;
    var pad = size * 0.06;
    var r = size / 2 - pad;
    var outerW = Math.max(2, r * 0.058);
    var ring = r * 0.23;
    var innerW = Math.max(1.5, r * 0.032);
    var outerR = r - outerW / 2;
    var innerR = r - ring;
    var textR = (outerR - outerW / 2 + innerR + innerW / 2) / 2;
    var band = (outerR - outerW / 2) - (innerR + innerW / 2);

    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineCap = "butt";
    ctx.lineJoin = "round";
    ctx.lineWidth = outerW;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = innerW;
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
    ctx.stroke();

    var name = opts.name;
    var letters = tokensOf(name);
    var family = opts.fontFamily;
    var weight = opts.fontWeight;
    var nTok = Math.max(1, letters.length);
    var preferGap = Math.PI * 0.55;
    var minGap = Math.PI * 0.42;
    var est = Math.min(band * 0.86, (textR * (Math.PI * 2 - preferGap)) / (nTok * 1.15));
    var gap = preferGap;
    if (est < band * 0.42) gap = minGap;
    else if (est < band * 0.58) gap = (preferGap + minGap) / 2;
    var span = Math.PI * 2 - gap;
    var i;

    if (letters.length) {
      var maxChar = Math.max(8, Math.min(band * 0.86, (textR * span) / (letters.length * 1.02)));
      var fontSize = maxChar;
      var totalW;
      for (var attempt = 0; attempt < 80; attempt++) {
        ctx.font = weight + " " + fontSize + "px " + family;
        totalW = 0;
        for (i = 0; i < letters.length; i++) {
          totalW += ctx.measureText(letters[i]).width;
        }
        totalW += fontSize * 0.12 * Math.max(0, letters.length - 1);
        if (totalW <= textR * span * 0.96 || fontSize <= 8) break;
        fontSize -= 1;
      }
      ctx.font = weight + " " + fontSize + "px " + family;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var widths = [];
      totalW = 0;
      for (i = 0; i < letters.length; i++) {
        widths[i] = ctx.measureText(letters[i]).width + (i ? fontSize * 0.12 : 0);
        totalW += widths[i];
      }
      var natural = totalW > 0 ? totalW / textR : span;
      var usedSpan;
      if (natural >= span * 0.55) usedSpan = span;
      else if (letters.length >= 10) usedSpan = Math.min(span, Math.max(natural * 1.15, Math.PI * 0.85));
      else usedSpan = Math.min(span, natural * 1.08);
      var usedStart = Math.PI * 1.5 - usedSpan / 2;
      var acc = 0;
      for (i = 0; i < letters.length; i++) {
        acc += widths[i] / 2;
        var t = totalW ? acc / totalW : 0.5;
        var ang = usedStart + t * usedSpan;
        ctx.save();
        ctx.translate(cx + Math.cos(ang) * textR, cy + Math.sin(ang) * textR);
        ctx.rotate(ang + Math.PI / 2);
        ctx.fillText(letters[i], 0, 0);
        ctx.restore();
        acc += widths[i] / 2;
      }
    }

    var innerBox = innerR * 2 * 0.86;
    var lines = phraseLines(opts.phrase);
    var owner = opts.owner;
    var biz = opts.bizNo ? formatBizNo(opts.bizNo) : "";
    var block = (owner ? 1 : 0) + lines.length + (biz ? 1 : 0);
    var lineMax = innerBox * (block === 1 ? 0.42 : block === 2 ? 0.26 : block === 3 ? 0.2 : 0.17);
    var used = [];
    if (owner) {
      used.push({ text: owner, size: fitFont(ctx, owner, family, weight, lineMax * 0.85, 8, innerBox * 0.9) });
    }
    for (i = 0; i < lines.length; i++) {
      used.push({ text: lines[i], size: fitFont(ctx, lines[i], family, weight, lineMax, 9, innerBox * 0.92) });
    }
    if (biz) {
      used.push({ text: biz, size: fitFont(ctx, biz, family, weight, lineMax * 0.72, 8, innerBox * 0.88) });
    }
    var gapY = size * 0.012;
    var totalH = 0;
    for (i = 0; i < used.length; i++) totalH += used[i].size;
    totalH += gapY * Math.max(0, used.length - 1);
    var y = cy - totalH / 2;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = ink;
    for (i = 0; i < used.length; i++) {
      ctx.font = weight + " " + used[i].size + "px " + family;
      ctx.fillText(used[i].text, cx, y);
      y += used[i].size + gapY;
    }
  }

  function drawWide(ctx, w, h, opts) {
    var ink = opts.color;
    var pad = Math.min(w, h) * 0.1;
    var boxW = w - pad * 2;
    var boxH = h - pad * 2;
    var x0 = pad;
    var y0 = pad;
    var outer = Math.max(2, Math.min(boxW, boxH) * 0.08);
    var inner = Math.max(1.5, outer * 0.42);
    var inset = outer * 1.7;

    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineJoin = "miter";
    ctx.miterLimit = 2;
    ctx.lineWidth = outer;
    ctx.strokeRect(x0 + outer / 2, y0 + outer / 2, boxW - outer, boxH - outer);
    ctx.lineWidth = inner;
    ctx.strokeRect(x0 + inset, y0 + inset, boxW - inset * 2, boxH - inset * 2);

    var rows = [];
    if (opts.name) rows.push({ text: opts.name, role: "name" });
    if (opts.bizNo) rows.push({ text: formatBizNo(opts.bizNo), role: "biz" });
    if (opts.owner) rows.push({ text: opts.owner, role: "owner" });
    if (!rows.length) return;

    var innerPadX = inset + inner + boxW * 0.04;
    var innerPadY = inset + inner + boxH * 0.08;
    var usableW = boxW - innerPadX * 2;
    var usableH = boxH - innerPadY * 2;
    var n = rows.length;
    var gapY = usableH * (n === 1 ? 0 : n === 2 ? 0.12 : 0.08);
    var lineSpace = (usableH - gapY * (n - 1)) / n;
    var family = opts.fontFamily;
    var weight = opts.fontWeight;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var y = y0 + innerPadY;
    for (var i = 0; i < n; i++) {
      var maxSize;
      if (rows[i].role === "name") maxSize = lineSpace * (n === 1 ? 0.78 : 0.86);
      else if (rows[i].role === "biz") maxSize = lineSpace * 0.72;
      else maxSize = lineSpace * 0.7;
      var size = fitFont(ctx, rows[i].text, family, weight, maxSize, 8, usableW);
      ctx.font = weight + " " + size + "px " + family;
      ctx.fillText(rows[i].text, x0 + boxW / 2, y + lineSpace / 2);
      y += lineSpace + gapY;
    }
  }

  function options() {
    return {
      shape: radio("shape") || "round",
      name: val("storeName") || val("ownerName"),
      owner: val("storeName") ? val("ownerName") : "",
      bizNo: formatBizNo(val("bizNo")),
      phrase: val("phrase") || "직인",
      color: inkColor(),
      fontFamily: fontStack(),
      fontWeight: radio("font") === "gothic" ? "700" : "800",
      texture: document.getElementById("texture").checked,
      exportSize: Number(sizeInput.value) || 1800
    };
  }

  function exportDims(opts, longSide) {
    if (opts.shape === "rect") {
      return { w: longSide, h: Math.max(1, Math.round(longSide / WIDE_RATIO)) };
    }
    return { w: longSide, h: longSide };
  }

  function render(canvas, w, h, opts) {
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    if (opts.shape === "rect") drawWide(ctx, w, h, opts);
    else drawRound(ctx, w, opts);
    if (opts.texture) applyTexture(ctx, w, h);
  }

  function previewCssSize() {
    var exportSize = Number(sizeInput.value) || 1800;
    return Math.round(200 + (exportSize - 1200) * (140 / 1200));
  }

  function updateSizeLabel() {
    var v = Number(sizeInput.value);
    document.getElementById("sizeLabel").textContent = v <= 1400 ? "작게" : v >= 2200 ? "크게" : "중간";
  }

  function redraw() {
    var opts = options();
    var dpr = Math.max(2, window.devicePixelRatio || 1);
    if (opts.shape === "rect") {
      stage.classList.add("wide");
      var cssW = stage.clientWidth || 480;
      var cssH = Math.max(1, Math.round(cssW / WIDE_RATIO));
      render(preview, Math.round(cssW * dpr), Math.round(cssH * dpr), opts);
      preview.style.width = cssW + "px";
      preview.style.height = cssH + "px";
    } else {
      stage.classList.remove("wide");
      var css = previewCssSize();
      render(preview, Math.round(css * dpr), Math.round(css * dpr), opts);
      preview.style.width = css + "px";
      preview.style.height = css + "px";
    }
  }

  function scheduleDraw() {
    clearTimeout(drawTimer);
    drawTimer = setTimeout(redraw, 40);
  }

  function formatBizField() {
    var el = bizInput;
    var old = el.value;
    var caret = el.selectionStart;
    var digitsBefore = old.slice(0, caret).replace(/\D/g, "").length;
    var formatted = formatBizNo(old);
    if (formatted === old) return;
    el.value = formatted;
    var i = 0, seen = 0;
    while (i < formatted.length && seen < digitsBefore) {
      if (/\d/.test(formatted.charAt(i))) seen++;
      i++;
    }
    try { el.setSelectionRange(i, i); } catch (e) {}
  }

  function safeFilePart(s) {
    return String(s || "").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ") || "직인";
  }

  function savePng() {
    var opts = options();
    if (!opts.name) {
      setMsg("점포(상호)명이나 대표자 성명을 입력해 주세요.", true);
      return;
    }
    setMsg("이미지를 만들고 있습니다.");
    var out = document.createElement("canvas");
    var dim = exportDims(opts, opts.exportSize);
    render(out, dim.w, dim.h, opts);
    var btn = document.getElementById("btnSave");
    btn.disabled = true;
    function finish() { btn.disabled = false; }
    if (!out.toBlob) {
      setMsg("이 브라우저에서는 이미지 저장을 지원하지 않습니다.", true);
      finish();
      return;
    }
    out.toBlob(function (blob) {
      if (!blob) {
        setMsg("이미지 저장에 실패했습니다.", true);
        finish();
        return;
      }
      var a = document.createElement("a");
      a.download = "직인_" + safeFilePart(compactName(opts.name) || opts.name) + ".png";
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
      setMsg("이미지를 저장했습니다.");
      finish();
    }, "image/png");
  }

  bizInput.addEventListener("input", function () {
    formatBizField();
    scheduleDraw();
  });
  ["storeName", "ownerName", "phrase", "sealSize", "texture"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", scheduleDraw);
    el.addEventListener("change", scheduleDraw);
  });
  document.querySelectorAll('input[name="shape"], input[name="font"], input[name="color"]').forEach(function (el) {
    el.addEventListener("change", scheduleDraw);
  });
  sizeInput.addEventListener("input", updateSizeLabel);
  document.getElementById("btnSave").addEventListener("click", savePng);
  window.addEventListener("resize", scheduleDraw);

  updateSizeLabel();
  function start() {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { redraw(); }).catch(function () { redraw(); });
    } else {
      redraw();
    }
  }
  start();

  window.__storeSeal = {
    options: options,
    render: render,
    redraw: redraw,
    formatBizNo: formatBizNo,
    exportCanvas: function (longSide) {
      var opts = options();
      var dim = exportDims(opts, longSide || opts.exportSize);
      var c = document.createElement("canvas");
      render(c, dim.w, dim.h, opts);
      return c;
    }
  };
})();
</script>
</body>
</html>
