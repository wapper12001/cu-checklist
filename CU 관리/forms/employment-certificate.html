<!DOCTYPE html>
<html lang="ko">
<head>

<title>재직증명서 - CU 편의점</title>
<style>
  @page { size: A4; margin: 18mm; }
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#eee; margin:0; color:#111; }
  .toolbar { text-align:center; padding:12px; }
  .toolbar button { font-size:15px; padding:8px 18px; margin:0 4px; cursor:pointer; border:1px solid #652f8d; background:#652f8d; color:#fff; border-radius:6px; }
  .toolbar button.sub { background:#fff; color:#652f8d; }
  .toolbar p { font-size:13px; color:#555; margin:8px 0 0; }
  .page { width:210mm; min-height:297mm; margin:0 auto 20px; background:#fff; padding:22mm 20mm; box-shadow:0 0 8px rgba(0,0,0,.15); position:relative; }
  .doc-no { font-size:13px; }
  h1 { text-align:center; font-size:34px; letter-spacing:18px; margin:18mm 0 14mm; }
  h2 { font-size:16px; margin:8mm 0 2mm; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { border:1px solid #333; padding:10px 8px; vertical-align:middle; }
  th { background:#f3f0f7; width:22%; font-weight:600; text-align:center; }
  td input, td select { width:100%; border:none; font:inherit; background:transparent; outline:none; }
  td input:focus { background:#fffbe6; }
  .inline input { width:auto; }
  textarea.addr { width:100%; border:none; font:inherit; background:transparent; outline:none; resize:none; overflow:hidden; line-height:1.5; padding:0; display:block; }
  td textarea.addr:focus { background:#fffbe6; }
  .issuer .addr-row { align-items:flex-start; }
  .issuer textarea.addr { flex:1; border-bottom:1px solid #999; padding:4px; }
  .statement { text-align:center; font-size:17px; margin:16mm 0 10mm; line-height:1.9; }
  .issue-date { text-align:center; font-size:16px; margin-bottom:12mm; }
  .issuer { width:80%; margin:0 auto; font-size:16px; }
  .issuer .row { display:flex; align-items:center; margin:8px 0; }
  .issuer .label { width:30%; }
  .issuer input { flex:1; border:none; border-bottom:1px solid #999; font:inherit; padding:4px; outline:none; }
  .seal-spot { position:relative; width:70px; height:70px; margin-left:6px; flex:0 0 auto; }
  .seal { width:100%; height:100%; border:1px dashed #999; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; color:#888; margin-left:0; }
  .seal-img { position:absolute; width:140px; height:92px; right:-8px; top:50%; transform:translateY(-50%) rotate(-6deg); object-fit:contain; object-position:right center; pointer-events:none; z-index:2; }
  .seal-spot.has-seal .seal { border-color:transparent; color:transparent; }
  .seal-controls { display:inline-block; margin:0 4px; vertical-align:middle; }
  .footer { position:absolute; bottom:18mm; left:20mm; right:20mm; text-align:center; font-size:12px; color:#666; }
  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .page { box-shadow:none; margin:0; width:auto; min-height:auto; padding:0; }
    td input:focus { background:transparent; }
    .seal { border-color:#bbb; }
    td textarea.addr:focus { background:transparent; }
    .footer { position:static; margin-top:8mm; }
    .doc-no { font-size:12px; }
    h1 { font-size:30px; margin:6mm 0 8mm; }
    h2 { font-size:15px; margin:5mm 0 2mm; }
    table { font-size:14px; }
    th, td { padding:7px 8px; }
    .statement { font-size:16px; margin:10mm 0 6mm; line-height:1.7; }
    .issue-date { margin-bottom:8mm; }
    .issuer { font-size:15px; }
    .issuer .row { margin:5px 0; }
    .seal-spot { width:60px; height:60px; }
    .seal { width:60px; height:60px; }
    .seal-img { width:120px; height:80px; }
    .page { break-inside:avoid; page-break-inside:avoid; }
  }

  .draft-status { font-size: 12px; color: #666; margin: 6px 0 0; min-height: 1em; }
  @media print { .draft-status { display: none !important; } }

  .share-panel { display: none; margin: 10px auto 0; max-width: 640px; text-align: left; background: #fff; border: 1px solid #d4c4e4; border-radius: 8px; padding: 10px 12px; }
  .share-panel.visible { display: block; }
  .share-panel label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; }
  .share-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .share-row input { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  .cuform-msg { font-size: 13px; margin: 6px 0 0; min-height: 1em; color: #555; }
  .cuform-msg.error { color: #a33; }
  @media print { .share-panel, .cuform-msg, .seal-controls, #btnSubmit, #btnManagerSign, #btnSealUpload, #btnSealClear { display: none !important; } }

  body.capturing { background: #fff !important; }
  body.capturing .toolbar, body.capturing .no-print, body.capturing .seal-controls { display: none !important; }
  body.capturing .page {
    width: 210mm !important;
    max-width: 210mm !important;
    min-height: 297mm !important;
    margin: 0 !important;
    padding: 22mm 20mm !important;
    box-shadow: none !important;
  }

</style>
</head>
<body>
<div class="toolbar no-print">
  <button type="button" id="btnPrint" onclick="window.print()">인쇄 / PDF로 저장</button>
  <button type="button" id="btnImage" class="sub">이미지로 저장</button>
  <button type="button" id="btnSubmit">제출</button>

    <div class="share-row">

</div>

<div class="page" id="certPage">
  <div class="doc-no">발급번호: <input id="issue_no" style="border:none;border-bottom:1px solid #999;font:inherit;width:140px"></div>

  <h1>재직증명서</h1>

    <tr><th>주 소</th><td colspan="3"><textarea id="person_addr" class="addr" rows="2"></textarea></td></tr>

    <tr><th>점 포 명</th><td colspan="3">
      <input id="store_name"></td></tr>
    <tr><th>직 책</th><td colspan="3"><input id="job_title"></td></tr>

    <tr><th>용 도</th><td colspan="3"><input id="purpose"></td></tr>

  <p class="statement">위 사람은 상기와 같이 당 점포에 재직하고 있음(재직하였음)을 증명합니다.</p>

  <p class="issue-date">발급일: <input id="issue_date" style="border:none;border-bottom:1px solid #999;font:inherit;width:200px"></p>

  <div class="issuer">
    <div class="row"><span class="label">점 포 명</span><input id="issuer_store"></div>
    <div class="row"><span class="label">사업자등록번호</span><input id="issuer_biz_no"></div>
    <div class="row addr-row"><span class="label">주 소</span><textarea id="issuer_addr" class="addr" rows="2"></textarea></div>
    <div class="row"><span class="label">발급자(대표자/점장)</span><input id="issuer_name"></div>
    <div class="row sign-row"><span class="label">서 명</span><input id="issuer_sign"><span class="seal-spot" id="issuerSealSpot"><span class="seal" id="issuerSealMark">(인)</span><img id="managerSealImg" class="seal-img" alt="" hidden></span></div>
  </div>

  <div class="footer">본 증명서는 발급일 기준으로 작성되었습니다.</div>
</div>

<script>
(function () {
  var STORAGE_KEY = "cuform:" + (function () {
    var p = (location.pathname || "").split("/").pop() || "";
    try { p = decodeURIComponent(p); } catch (e) {}
    return p || "form.html";
  })();
  var restoring = false;
  var saveTimer = null;
  var statusEl = document.getElementById("draftStatus");

  function setStatus(msg) {
    if (statusEl) statusEl.textContent = msg || "";
  }
  function canStore() {
    try {
      var k = STORAGE_KEY + "/__t";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }
  function fieldList() {
    return Array.prototype.slice.call(document.querySelectorAll("input, textarea, select")).filter(function (el) {
      return !el.closest(".toolbar, .share-panel");
    });
  }
  function domPath(el) {
    var parts = [];
    var cur = el;
    while (cur && cur.nodeType === 1 && cur !== document.documentElement) {
      if (cur.id) { parts.unshift(cur.tagName.toLowerCase() + "#" + cur.id); break; }
      var parent = cur.parentElement;
      if (!parent) { parts.unshift(cur.tagName.toLowerCase()); break; }
      var tag = cur.tagName;
      var same = 0, idx = 0, kids = parent.children;
      for (var i = 0; i < kids.length; i++) {
        if (kids[i].tagName === tag) {
          if (kids[i] === cur) idx = same;
          same++;
        }
      }
      parts.unshift(same > 1 ? cur.tagName.toLowerCase() + "[" + idx + "]" : cur.tagName.toLowerCase());
      cur = parent;
    }
    return parts.join(">");
  }
  function fieldKey(el) {
    if (el.id) return "id:" + el.id;
    var aria = el.getAttribute("aria-label");
    if (aria) return "aria:" + el.tagName + ":" + el.type + ":" + aria;
    if (el.name) return "name:" + el.type + ":" + el.name + ":" + (el.value || "");
    return "path:" + domPath(el);
  }
  function canvasList() {
    return Array.prototype.slice.call(document.querySelectorAll("canvas.sig, canvas[id^='sig']"));
  }
  function canvasKey(c, i) { return c.id ? "id:" + c.id : "ix:" + i; }
  function isSignedCanvas(canvas) {
    if (canvas.dataset.signed === "1") return true;
    try {
      var ctx = canvas.getContext("2d");
      var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      for (var i = 3; i < data.length; i += 16) { if (data[i] > 8) return true; }
    } catch (e) {}
    return false;
  }
  function collect() {
    var data = { fields: {}, signatures: {} };
    fieldList().forEach(function (el) {
      var type = (el.type || "").toLowerCase();
      if (type === "button" || type === "submit" || type === "reset" || type === "file") return;
      var key = fieldKey(el);
      if (type === "checkbox" || type === "radio") data.fields[key] = { t: type, c: !!el.checked, v: el.value };
      else data.fields[key] = { t: type || el.tagName.toLowerCase(), v: el.value };
    });
    canvasList().forEach(function (c, i) {
      if (isSignedCanvas(c)) data.signatures[canvasKey(c, i)] = c.toDataURL("image/png");
    });
    return data;
  }
  var holdOffSave = false;
  function saveDraft() {
    if (restoring || holdOffSave) return;
    if (document.body && document.body.classList.contains("capturing")) return;
    if (!canStore()) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collect()));
      setStatus("임시저장됨");
    } catch (e) {}
  }
  function saveDraftSoon() {
    if (restoring || holdOffSave) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 300);
  }
  function clearDraft() {
    holdOffSave = true;
    clearTimeout(saveTimer);
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setStatus("");
  }
  function resumeIfTrusted(e) {
    if (holdOffSave && e && e.isTrusted) holdOffSave = false;
  }
  function restoreCanvas(canvas, dataUrl) {
    return new Promise(function (resolve) {

          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);

        var ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, canvas.clientWidth || w, canvas.clientHeight || h);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1.8;
        ctx.drawImage(img, 0, 0, canvas.clientWidth || w, canvas.clientHeight || h);
        canvas.dataset.signed = "1";
        resolve();
      };
      img.onerror = function () { resolve(); };
      img.src = dataUrl;
    });
  }
  function restore() {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("d") && q.get("k")) return Promise.resolve(false);
    } catch (e) {}
    if (!canStore()) return Promise.resolve(false);
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return Promise.resolve(false); }
    if (!raw) return Promise.resolve(false);
    var data;
    try { data = JSON.parse(raw); } catch (e) { return Promise.resolve(false); }
    if (!data || typeof data !== "object") return Promise.resolve(false);
    restoring = true;
    fieldList().forEach(function (el) {
      var type = (el.type || "").toLowerCase();
      if (type === "button" || type === "submit" || type === "reset" || type === "file") return;
      var rec = data.fields && data.fields[fieldKey(el)];
      if (!rec) return;
      if (type === "checkbox" || type === "radio") el.checked = !!rec.c;
      else if (rec.v != null) el.value = rec.v;
    });
    document.querySelectorAll("textarea").forEach(function (t) {
      t.dispatchEvent(new Event("input", { bubbles: true }));
    });
    var jobs = [];
    canvasList().forEach(function (c, i) {
      var url = data.signatures && data.signatures[canvasKey(c, i)];

    });
    return Promise.all(jobs).then(function () {
      restoring = false;
      setStatus("임시저장됨");
      return true;
    }, function () {
      restoring = false;
      return false;
    });
  }

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    resumeIfTrusted(e);
    saveDraftSoon();
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    resumeIfTrusted(e);
    saveDraft();
  });
  document.addEventListener("pointerup", function (e) {
    if (e.target && e.target.tagName === "CANVAS") {
      resumeIfTrusted(e);

    }

    if (e.target && e.target.tagName === "CANVAS") {
      resumeIfTrusted(e);
      saveDraft();
    }
  }, true);
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var btn = t.closest("button");
    if (btn && (btn.id === "btnPrint" || /window\.print\s*\(/.test(btn.getAttribute("onclick") || "") || /^\s*(출력|인쇄)/.test((btn.textContent || "").trim()))) {
      clearDraft();
    }
    if (btn && (btn.id === "btnImage" || /이미지로\s*저장/.test(btn.textContent || ""))) {
      clearDraft();
    }
    if (t.closest(".btn-clear, [data-clear]")) {
      resumeIfTrusted(e);
      setTimeout(saveDraft, 0);
      return;
    }
    if (btn && /초기화|리셋|다시\s*작성|모두\s*지움|전체\s*삭제/.test((btn.textContent || ""))) {
      setTimeout(clearDraft, 0);
    }
  }, true);

  window.addEventListener("beforeprint", function () { clearDraft(); });
  window.addEventListener("afterprint", function () { clearDraft(); });
  if (window.matchMedia) {
    var printMq = window.matchMedia("print");
    var onPrintMq = function (e) { if (e && e.matches) clearDraft(); };

    else if (printMq.addListener) printMq.addListener(onPrintMq);
  }
  if (typeof window.print === "function") {
    var origPrint = window.print;
    window.print = function () {
      clearDraft();
      return origPrint.apply(window, arguments);
    };
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "A" || !t.hasAttribute("download")) return;
    var href = t.getAttribute("href") || "";
    if (/^data:image\/png/i.test(href) || /^blob:/i.test(href)) clearDraft();
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { restore(); });
  } else {
    restore();
  }

  function applyData(data) {
    if (!data || typeof data !== "object") return Promise.resolve(false);
    restoring = true;
    fieldList().forEach(function (el) {
      var type = (el.type || "").toLowerCase();
      if (type === "button" || type === "submit" || type === "reset" || type === "file") return;
      var rec = data.fields && data.fields[fieldKey(el)];
      if (!rec) return;
      if (type === "checkbox" || type === "radio") el.checked = !!rec.c;
      else if (rec.v != null) el.value = rec.v;
    });
    document.querySelectorAll("textarea").forEach(function (t) {
      t.dispatchEvent(new Event("input", { bubbles: true }));
    });
    var jobs = [];
    canvasList().forEach(function (c, i) {
      var url = data.signatures && data.signatures[canvasKey(c, i)];
      if (url) jobs.push(restoreCanvas(c, url));
    });
    return Promise.all(jobs).then(function () {
      restoring = false;
      return true;
    }, function () {
      restoring = false;
      return false;
    });
  }

})();
</script>


<script>
(function () {
  var API = "https://rfctnigrqzdqnpavwlyi.supabase.co";
  var KEY = "sb_publishable_TSKqKqeXyy_ldx9crBsL3g_rGpkzp7w";
  var FORM_TYPE = (function () {
    var p = (location.pathname || "").split("/").pop() || "";
    try { p = decodeURIComponent(p); } catch (e) {}
    return p.replace(/\.html$/i, "") || "form";
  })();
  var MANAGER_FIELD_IDS = {
    "employment-certificate": ["issue_no", "issue_date", "issuer_store", "issuer_biz_no", "issuer_addr", "issuer_name", "issuer_sign"],
    "cu-labor-contract-uniform-hours": [],
    "cu-labor-contract-daily-hours": []
  };
  var MANAGER_SIG_IDS = {
    "employment-certificate": [],
    "cu-labor-contract-uniform-hours": ["sigEmployer"],
    "cu-labor-contract-daily-hours": ["sigEmployer"]
  };
  var managerFields = MANAGER_FIELD_IDS[FORM_TYPE] || [];
  var managerSigs = MANAGER_SIG_IDS[FORM_TYPE] || [];
  var currentDoc = null;
  var currentSeal = "";

  function $(id) { return document.getElementById(id); }
  function queryDoc() {
    try {
      var q = new URLSearchParams(location.search);
      return { id: q.get("d"), token: q.get("k") };
    } catch (e) { return { id: null, token: null }; }
  }
  function setMsg(text, isError) {
    var el = $("cuformMsg");
    if (!el) return;
    el.textContent = text || "";
    el.className = "cuform-msg" + (isError ? " error" : "");
  }
  function rpc(name, body) {
    return fetch(API + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {
        apikey: KEY,
        Authorization: "Bearer " + KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var json = null;
        if (text) {
          try { json = JSON.parse(text); } catch (e) { json = null; }
        }
        if (!res.ok) {
          var msg = (json && (json.message || json.error || json.hint)) || "요청에 실패했습니다.";
          throw new Error(msg);
        }
        return json;
      });
    });
  }
  function isManagerField(el) {
    return !!(el && el.id && managerFields.indexOf(el.id) >= 0);
  }
  function isManagerCanvas(el) {
    return !!(el && el.id && managerSigs.indexOf(el.id) >= 0);
  }
  function setFieldLocked(el, locked) {
    if (!el) return;
    var type = (el.type || "").toLowerCase();
    if (type === "checkbox" || type === "radio") {
      el.style.pointerEvents = locked ? "none" : "";
      el.tabIndex = locked ? -1 : 0;
    } else {
      el.readOnly = !!locked;
    }
  }
  function setCanvasLocked(canvas, locked) {
    if (!canvas) return;
    canvas.style.pointerEvents = locked ? "none" : "";
    var clr = document.querySelector('.btn-clear[data-clear="' + canvas.id + '"]');
    if (clr) clr.style.display = locked ? "none" : "";
  }
  function applyLocks(mode) {
    document.querySelectorAll("input, textarea, select").forEach(function (el) {
      var typ = (el.type || "").toLowerCase();
      if (typ === "button" || typ === "submit" || typ === "reset" || typ === "file") return;
      if (mode === "local") setFieldLocked(el, false);
      else if (mode === "completed") setFieldLocked(el, true);
      else setFieldLocked(el, !isManagerField(el));
    });
    document.querySelectorAll("canvas.sig, canvas[id^='sig']").forEach(function (c) {
      if (mode === "local") setCanvasLocked(c, false);
      else if (mode === "completed") setCanvasLocked(c, true);
      else setCanvasLocked(c, !isManagerCanvas(c));
    });
  }
  function shareUrl(id, token) {
    var u = new URL(location.href);
    u.search = "";
    u.hash = "";
    u.searchParams.set("d", id);
    u.searchParams.set("k", token);
    return u.toString();
  }
  function showSharePanel(url, completed) {
    var panel = $("sharePanel");
    var input = $("shareLink");
    var label = $("shareLabel");
    if (input) input.value = url || "";
    if (label) label.textContent = completed
      ? "이 링크로 완성본을 열어 출력하거나 이미지로 저장할 수 있습니다."
      : "점장에게 이 링크를 보내 주세요.";
    if (panel) {
      panel.classList.add("visible");
      panel.hidden = false;
    }
    var shareBtn = $("btnShareLink");
    if (shareBtn) shareBtn.style.display = (navigator.share ? "" : "none");
  }
  function hideSharePanel() {
    var panel = $("sharePanel");
    if (panel) {
      panel.classList.remove("visible");
      panel.hidden = true;
    }
  }
  function setMode(mode) {
    document.body.setAttribute("data-cuform-mode", mode);
    var submit = $("btnSubmit");
    var mgr = $("btnManagerSign");
    if (submit) {
      submit.hidden = mode !== "local";
      submit.style.display = mode === "local" ? "" : "none";
    }
    if (mgr) {
      mgr.hidden = mode !== "submitted";
      mgr.style.display = mode === "submitted" ? "" : "none";
    }
    var sealCtrl = $("sealControls");
    if (sealCtrl) {
      var showSeal = mode === "submitted";
      sealCtrl.hidden = !showSeal;
      sealCtrl.style.display = showSeal ? "" : "none";
    }
    applyLocks(mode);
  }
  function currentMode() {
    return document.body.getAttribute("data-cuform-mode") || "local";
  }
  function setSeal(dataUrl) {
    currentSeal = dataUrl || "";
    var img = $("managerSealImg");
    var spot = $("issuerSealSpot") || document.querySelector(".seal-spot");
    var clearBtn = $("btnSealClear");
    if (img) {
      if (currentSeal) {
        img.src = currentSeal;
        img.hidden = false;
      } else {
        img.removeAttribute("src");
        img.hidden = true;
      }
    }
    if (spot) {
      if (currentSeal) spot.classList.add("has-seal");
      else spot.classList.remove("has-seal");
    }
    if (clearBtn) clearBtn.hidden = !currentSeal;
  }
  function applySealFromData(data) {
    var sigs = data && data.signatures;
    var url = "";
    if (sigs && typeof sigs === "object") {
      url = sigs.manager_seal || sigs["id:manager_seal"] || "";
    }
    setSeal(url);
  }
  function downscaleSeal(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error("파일을 선택해 주세요.")); return; }
      var typ = (file.type || "").toLowerCase();
      if (typ !== "image/png") {
        reject(new Error("투명 배경의 PNG 파일을 선택해 주세요."));
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var maxSide = 400;
        var dataUrl = "";
        function render(side) {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) return "";
          var scale = Math.min(1, side / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var c = document.createElement("canvas");
          c.width = cw;
          c.height = ch;
          var ctx = c.getContext("2d");
          ctx.clearRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          return c.toDataURL("image/png");
        }
        dataUrl = render(maxSide);
        if (!dataUrl || dataUrl.indexOf("data:image/png;base64,") !== 0) {
          reject(new Error("직인 이미지를 읽지 못했습니다."));
          return;
        }
        var sides = [320, 240, 180, 140];
        var i = 0;
        while (dataUrl.length > 600000 && i < sides.length) {
          dataUrl = render(sides[i]);
          i++;
        }
        if (dataUrl.length < 256 || dataUrl.length > 700000) {
          reject(new Error("직인 이미지가 너무 크거나 올바르지 않습니다. 더 작은 PNG로 다시 올려 주세요."));
          return;
        }
        resolve(dataUrl);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("직인 이미지를 읽지 못했습니다."));
      };
      img.src = url;
    });
  }
  function collectAll() {
    if (!window.__cuformDraft || typeof window.__cuformDraft.collect !== "function") {
      throw new Error("작성 내용을 모을 수 없습니다. 페이지를 새로고침해 주세요.");
    }
    return window.__cuformDraft.collect();
  }
  function collectManager() {
    var all = collectAll();
    var out = { fields: {}, signatures: {} };
    managerFields.forEach(function (id) {
      var k = "id:" + id;
      if (all.fields && all.fields[k]) out.fields[k] = all.fields[k];
    });
    managerSigs.forEach(function (id) {
      var k = "id:" + id;
      if (all.signatures && all.signatures[k]) out.signatures[k] = all.signatures[k];
    });
    if (currentSeal && currentSeal.indexOf("data:image/png;base64,") === 0 && currentSeal.length >= 256) {
      out.signatures.manager_seal = currentSeal;
    }
    return out;
  }
  function applyDoc(doc) {
    currentDoc = doc;
    var draft = window.__cuformDraft;
    var finish = function () {
      applySealFromData(doc && doc.data);
      return doc;
    };
    if (draft && typeof draft.apply === "function" && doc && doc.data) {
      return draft.apply(doc.data).then(function () {
        if (draft.clear) draft.clear();
        return finish();
      });
    }
    return Promise.resolve(finish());
  }
  function bind() {
    var btnSubmit = $("btnSubmit");
    if (btnSubmit) {
      btnSubmit.addEventListener("click", function () {
        btnSubmit.disabled = true;
        setMsg("제출하는 중입니다.");
        rpc("form_document_create", { p_form_type: FORM_TYPE, p_data: collectAll() })
          .then(function (doc) {
            if (window.__cuformDraft && window.__cuformDraft.clear) window.__cuformDraft.clear();
            var url = shareUrl(doc.id, doc.token);
            if (history.replaceState) history.replaceState({}, "", url);
            currentDoc = doc;
            showSharePanel(url, false);
            setMode("submitted");
            setMsg("제출되었습니다. 아래 링크를 점장에게 보내 주세요.");
          })
          .catch(function (err) { setMsg(err.message || "제출에 실패했습니다.", true); })
          .then(function () { btnSubmit.disabled = false; });
      });
    }
    var btnMgr = $("btnManagerSign");
    if (btnMgr) {
      btnMgr.addEventListener("click", function () {
        var q = queryDoc();
        if (!q.id || !q.token) { setMsg("링크가 올바르지 않습니다.", true); return; }
        btnMgr.disabled = true;
        setMsg("서명을 제출하는 중입니다.");
        rpc("form_document_manager_sign", { p_id: q.id, p_token: q.token, p_manager_data: collectManager() })
          .then(function (doc) {
            return applyDoc(doc).then(function () {
              var url = shareUrl(doc.id, q.token);
              showSharePanel(url, true);
              setMode("completed");
              setMsg("점장 서명이 완료되었습니다. 출력하거나 이미지로 저장할 수 있습니다.");
            });
          })
          .catch(function (err) { setMsg(err.message || "서명 제출에 실패했습니다.", true); })
          .then(function () { btnMgr.disabled = false; });
      });
    }
    var btnSealUp = $("btnSealUpload");
    var sealFile = $("sealFile");
    if (btnSealUp && sealFile) {
      btnSealUp.addEventListener("click", function () {
        if (currentMode() !== "submitted") return;
        sealFile.value = "";
        sealFile.click();
      });
      sealFile.addEventListener("change", function () {
        if (currentMode() !== "submitted") return;
        var file = sealFile.files && sealFile.files[0];
        if (!file) return;
        downscaleSeal(file)
          .then(function (dataUrl) {
            setSeal(dataUrl);
            setMsg("직인을 올렸습니다. 서명 제출을 눌러 주세요.");
          })
          .catch(function (err) {
            setMsg((err && err.message) || "직인 이미지를 올리지 못했습니다.", true);
          })
          .then(function () { sealFile.value = ""; });
      });
    }
    var btnSealClear = $("btnSealClear");
    if (btnSealClear) {
      btnSealClear.addEventListener("click", function () {
        if (currentMode() !== "submitted") return;
        setSeal("");
        setMsg("직인을 지웠습니다.");
      });
    }

    var btnCopy = $("btnCopyLink");
    if (btnCopy) {
      btnCopy.addEventListener("click", function () {
        var input = $("shareLink");
        var text = input ? input.value : "";
        if (!text) return;
        var done = function () { setMsg("링크를 복사했습니다."); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            input.select();
            try { document.execCommand("copy"); done(); } catch (e) { setMsg("복사에 실패했습니다. 링크를 길게 눌러 복사해 주세요.", true); }
          });
        } else {
          input.select();
          try { document.execCommand("copy"); done(); } catch (e) { setMsg("복사에 실패했습니다. 링크를 길게 눌러 복사해 주세요.", true); }
        }
      });
    }
    var btnShare = $("btnShareLink");
    if (btnShare) {
      btnShare.addEventListener("click", function () {
        var input = $("shareLink");
        var text = input ? input.value : "";
        if (!text || !navigator.share) return;
        navigator.share({ title: document.title, url: text }).catch(function () {});
      });
    }

    if (FORM_TYPE === "employment-certificate" && $("btnImage") && !document.getElementById("btnImage").dataset.bound) {
      $("btnImage").dataset.bound = "1";
      $("btnImage").addEventListener("click", function () {
        if (typeof html2canvas !== "function") {
          setMsg("이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.", true);
          return;
        }
        var btn = $("btnImage");
        var page = document.querySelector(".page");
        if (!page) return;
        btn.disabled = true;
        document.body.classList.add("capturing");
        document.querySelectorAll("textarea").forEach(function (t) {
          t.style.height = "auto";
          t.style.height = t.scrollHeight + "px";
        });
        void page.offsetWidth;
        html2canvas(page, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          logging: false,
          windowWidth: Math.max(900, page.scrollWidth + 48)
        }).then(function (canvas) {
          document.body.classList.remove("capturing");
          var a = document.createElement("a");
          var nameEl = $("person_name");
          var name = ((nameEl && nameEl.value) || "미기재").trim().replace(/[\\/:*?"<>|]+/g, "") || "미기재";
          var now = new Date();
          var ymd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0");
          a.download = "재직증명서_" + name + "_" + ymd + ".png";
          a.href = canvas.toDataURL("image/png");
          document.body.appendChild(a);
          a.click();
          a.remove();
        }).catch(function () {
          document.body.classList.remove("capturing");
          setMsg("이미지 저장에 실패했습니다.", true);
        }).then(function () { btn.disabled = false; });
      });
    }
  }

  function start() {
    bind();
    var q = queryDoc();
    if (q.id && q.token) {
      setMsg("문서를 불러오는 중입니다.");
      rpc("form_document_get", { p_id: q.id, p_token: q.token })
        .then(function (doc) {
          return applyDoc(doc).then(function () {
            var completed = doc.status === "completed";
            showSharePanel(shareUrl(doc.id, q.token), completed);
            setMode(completed ? "completed" : "submitted");
            setMsg(completed ? "완성된 서식입니다. 출력하거나 이미지로 저장할 수 있습니다." : "내용을 확인한 뒤 점장 서명을 해 주세요.");
          });
        })
        .catch(function (err) {
          setMode("local");
          hideSharePanel();
          setMsg(err.message || "문서를 열 수 없습니다.", true);
        });
    } else {
      setMode("local");
      hideSharePanel();
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
</body>
